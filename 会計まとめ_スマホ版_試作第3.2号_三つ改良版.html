<title>会計まとめ</title>
<style>
:root{
  --blue:#1683e6; --bluebg:#eaf6ff; --line:#dfe7ef;
  --text:#222; --muted:#6d7782; --yellow:#fff7cf;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f5f7fa;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{font-size:17px}
.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:#fff;padding-bottom:82px}
header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:21px;margin:0}.header-pencil{font-size:20px;margin-left:6px;vertical-align:2px}
.iconbtn{border:0;background:none;color:var(--blue);font-size:30px;line-height:1;padding:0 4px}
.month{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}
.month button{border:0;background:none;color:var(--blue);font-size:32px;line-height:1;padding:10px 14px;min-width:54px}
.month strong{font-size:20px}
.daybar{display:flex;justify-content:space-between;padding:12px 18px 8px;font-weight:700}
.daybar span:last-child{font-size:15px;color:var(--muted)}
.primary{display:block;width:calc(100% - 28px);margin:8px 14px 14px;border:0;border-radius:13px;
  background:#dff2ff;color:#0874d1;font-size:20px;font-weight:700;padding:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid #d5dee8;background:#fff;border-radius:22px;padding:8px 15px;font-size:15px}.card .filter{font-size:16px;padding:8px 14px}
.filter.active{background:#e7f4ff;color:#0874d1;border-color:#a9d9ff;font-weight:700}
.card{margin:9px 14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px}
.title{font-weight:700;font-size:17px}.amount{font-weight:800;font-size:19px}
.sub{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5}
.badge{display:inline-block;border-radius:10px;padding:2px 7px;font-size:12px;margin-left:4px}
.badge.warn{background:#fff0c2;color:#8a6100}\n.advance-direction{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:10px;background:#fff4cf;color:#7a5a00;font-weight:800;font-size:15px}.badge.ok{background:#e8f8ec;color:#2b7b40}
.empty{margin:35px 18px;padding:30px 18px;text-align:center;color:var(--muted);border:1px dashed #cbd6df;border-radius:15px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:72px;
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;z-index:10}
nav button{flex:1;border:0;background:none;color:#8a95a0;font-size:13px}
nav button.active{color:var(--blue);font-weight:700}
nav .ico{font-size:22px;display:block;margin-bottom:2px}
.panel{padding:16px}.panel h2{font-size:20px;margin:4px 0 16px}
label{display:block;font-weight:700;margin:14px 0 7px}
input,select,textarea{width:100%;font:inherit;border:1px solid #cfd9e3;border-radius:11px;padding:12px;background:#fff}
textarea{min-height:78px;resize:vertical}
.type{display:flex;gap:8px}.type button{flex:1;padding:11px;border:1px solid #ccd7e1;background:#fff;border-radius:10px;font-size:16px}
.type button.active{background:#e7f4ff;color:#0874d1;border-color:#9ed5ff;font-weight:700}
.form-actions{display:flex;gap:10px;margin-top:20px}.form-actions button{flex:1;padding:13px;border-radius:11px;font-size:18px}
.cancel{border:1px solid #d5dee8;background:#fff}.save{border:0;background:#1683e6;color:#fff;font-weight:700}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
.section{padding:12px 16px}.stat{background:#f7fbff;border:1px solid #d9ebf8;border-radius:14px;padding:14px;margin-bottom:10px}
.stat b{font-size:22px}.small{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.listline{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.danger{color:#c33}

/* iPhoneで下部ナビが見やすいように調整 */
nav button {
  font-size: 17px !important;
  line-height: 1.2 !important;
  min-height: 72px;
}
nav .ico {
  font-size: 28px !important;
  margin-bottom: 3px;
}


.select-toolbar{text-align:center;padding:6px 0 8px;}
.delete-selected{padding:8px 14px;border:1px solid #e3b8b8;border-radius:999px;background:#fff;color:#b24a4a;font-size:14px;font-weight:700;}
.delete-selected:disabled{opacity:.45;color:#8a95a0;border-color:#d5dee8;}
.delete-selected:not(:disabled):active{transform:scale(.98);}
.select-record{display:flex;align-items:center;gap:7px;margin:0!important;font-weight:600!important;font-size:14px!important;color:#68727d;}
.select-record input{width:22px;height:22px;margin:0;accent-color:#1683e6;}
.delete-confirm{margin:0 14px 14px;padding:12px;border:1px solid #e3b8b8;border-radius:14px;background:#fff7f7;text-align:center;}
.delete-confirm button{padding:10px 16px;border-radius:10px;font-size:16px;font-weight:700;margin:5px;}
.delete-yes{border:0;background:#c94b4b;color:#fff;}
.delete-no{border:1px solid #ccd7e1;background:#fff;color:#333;}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>会計まとめ <span class="header-pencil" aria-hidden="true">✏️</span></h1>
</header>

<main id="main"></main>

<nav>
  <button class="active" data-tab="records"><span class="ico">📝</span>記録</button>
  <button data-tab="accounts"><span class="ico">▦</span>会計</button>
  <button data-tab="summary"><span class="ico">◔</span>集計</button>
  <button data-tab="search"><span class="ico">⌕</span>検索</button>
  <button data-tab="settings"><span class="ico">⚙</span>設定</button>
</nav>
</div>

<script>
const KEY="kaikei_matome_records_v3";
const ACCOUNTS=["教会","自分","少年会","団長上和費","セレナ","その他"];
const METHODS=["現金","口座振替","クレジットカード","デビットカード","振込","PayPay","ポイント","ETC・後日請求"];
const LOCATIONS=["現金","教会現金","自分の現金","銀行口座","PayPay残高","ポイント","その他"];
let records=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentTab="records", currentFilter="すべて", editingId=null, currentDate=today();

const yen=n=>Number(n||0).toLocaleString("ja-JP")+"円";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(records));}
function today(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dateJP(d){const x=new Date(d+"T00:00:00");return `${x.getMonth()+1}月${x.getDate()}日 ${"日月火水木金土"[x.getDay()]}曜日`}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
  if(currentTab==="records") renderRecords();
  if(currentTab==="accounts") renderAccounts();
  if(currentTab==="summary") renderSummary();
  if(currentTab==="search") renderSearch();
  if(currentTab==="settings") renderSettings();
}
function advanceDirection(r){
  if(r.advanceDirection) return r.advanceDirection;
  const payer=(r.payer||"").trim();
  if(r.account==="教会" && payer==="大和") return "教会 → 大和";
  if(r.account==="自分" && payer==="大和") return "大和 → 教会";
  if(r.account==="セレナ" && payer==="大和") return "セレナ → 大和";
  if(r.account==="自分" && payer) return `大和 → ${payer}`;
  return `${r.account} → ${payer||"相手"}`;
}
function recordCard(r){
  const sign=r.kind==="収入"?"+":"−";
  const badges=[
    r.status==="未確定"?`<span class="badge warn">未確定</span>`:"",
    r.advance?`<span class="badge warn">立替</span>`:""
  ].join("");
  const advanceLine=r.advance?`<div class="advance-direction">立替：${esc(advanceDirection(r))}</div>`:"";
  const detail=[
    r.account,
    r.payee?`先：${esc(r.payee)}`:"",
    r.purpose?`用途：${esc(r.purpose)}`:"",
    r.method?`方法：${esc(r.method)}`:"",
    r.location?`場所：${esc(r.location)}`:""
  ].filter(Boolean).join("　");
  return `<div class="card">
    <div class="row">
      <label class="select-record"><input type="checkbox" class="record-check" data-id="${r.id}"><span>選択</span></label>
      <div class="amount">${sign}${yen(r.amount)}</div>
    </div>
    <div class="title" style="margin-top:7px">${esc(r.kind)} ${badges}</div>
    ${advanceLine}
    <div class="sub">${esc(detail)}</div>
    ${r.note?`<div class="sub">メモ：${esc(r.note)}</div>`:""}
    <div style="display:flex;gap:8px;margin-top:10px">
      <button type="button" class="filter" onclick="openForm('${r.id}')">✏️ 編集</button>
    </div>
  </div>`;
}

function renderRecords(){
  const filtered=records.filter(r=>r.date===currentDate && (
    currentFilter==="すべて" ||
    (currentFilter==="立替" && r.advance) ||
    (currentFilter==="未確定" && r.status==="未確定") ||
    r.account===currentFilter
  ));
  filtered.sort((a,b)=>b.id-a.id);

  const d=new Date(currentDate+"T00:00:00");
  const dateLabel=`${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;

  let html=`<div class="month">
    <button type="button" id="prevDate" aria-label="前の日">‹</button>
    <strong>${dateLabel}</strong>
    <button type="button" id="nextDate" aria-label="次の日">›</button>
  </div>`;
  html+=`<div style="text-align:center;padding:7px 0 2px">
    <button type="button" class="filter ${currentDate===today()?"active":""}" id="todayBtn">今日</button>
  </div>`;
  html+=`<button class="primary" id="recordBtn" type="button">＋ 記録する</button>`;
  html+=`<div class="filters">${["すべて","教会","セレナ","立替","未確定"].map(f=>`<button class="filter ${currentFilter===f?"active":""}" onclick="setFilter('${f}')">${f}</button>`).join("")}</div>`;

  if(!filtered.length){
    html+=`<div class="empty">${currentDate===today()?"今日":"この日"}の記録はありません。<br>「＋ 記録する」から記録できます。</div>`;
  } else {
    html+=`<div class="daybar"><span>${dateJP(currentDate)}</span><span>${filtered.length}件</span></div>`;
    html+=`<div class="select-toolbar"><button type="button" class="delete-selected" id="deleteSelected" disabled>🗑️ 選択した記録を削除（0件）</button></div>`;
    filtered.forEach(r=>html+=recordCard(r));
  }
  document.getElementById("main").innerHTML=html;

  // 選択した記録だけを削除する
  const checks=[...document.querySelectorAll(".record-check")];
  const deleteSelected=document.getElementById("deleteSelected");
  const updateDeleteButton=()=>{
    const n=document.querySelectorAll(".record-check:checked").length;
    if(deleteSelected){
      deleteSelected.textContent=`🗑️ 選択した記録を削除（${n}件）`;
      deleteSelected.disabled=n===0;
    }
  };
  checks.forEach(ch=>ch.addEventListener("change",updateDeleteButton));
  if(deleteSelected) deleteSelected.addEventListener("click",()=>{
    const ids=checks.filter(c=>c.checked).map(c=>String(c.dataset.id));
    if(!ids.length)return;
    const box=document.createElement("div");
    box.className="delete-confirm";
    box.innerHTML=`<div><b>${ids.length}件を削除しますか？</b><br><span class="small">選択した記録だけが削除されます。この操作は元に戻せません。</span></div>
      <button type="button" class="delete-yes" id="deleteYes">削除する</button>
      <button type="button" class="delete-no" id="deleteNo">やめる</button>`;
    deleteSelected.replaceWith(box);
    document.getElementById("deleteNo").addEventListener("click",()=>render());
    document.getElementById("deleteYes").addEventListener("click",()=>{
      const idSet=new Set(ids);
      records=records.filter(r=>!idSet.has(String(r.id)));
      save();
      render();
    });
  });

  document.getElementById("prevDate").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    moveDate(-1);
  });
  document.getElementById("nextDate").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    moveDate(1);
  });
  document.getElementById("todayBtn").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    goToday();
  });
  document.getElementById("recordBtn").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    openForm();
  });
}
function setFilter(f){currentFilter=f;render()}

function moveDate(offset){
  const parts=currentDate.split("-").map(Number);
  const d=new Date(parts[0], parts[1]-1, parts[2]);
  d.setDate(d.getDate()+offset);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  currentDate=`${y}-${m}-${day}`;
  render();
}

function goToday(){
  currentDate=today();
  render();
}

function openForm(id){
  editingId=id||null; const r=id?records.find(x=>x.id==id):null;
  const kind=r?.kind||"支出";
  document.getElementById("main").innerHTML=`
  <div class="panel">
    <h2>${r?"記録を編集":"記録する"}</h2>
    <label>日付</label><input id="f_date" type="date" value="${r?.date||today()}">
    <label>種類</label><div class="type">${["支出","収入","お金を移す"].map(k=>`<button class="${kind===k?"active":""}" onclick="setKind('${k}')">${k}</button>`).join("")}</div>
    <input id="f_kind" type="hidden" value="${kind}">
    <label>金額</label><input id="f_amount" type="number" inputmode="numeric" placeholder="例：5000" value="${r?.amount||""}">
    <label>会計</label><select id="f_account">${ACCOUNTS.map(a=>`<option ${a===(r?.account||"教会")?"selected":""}>${a}</option>`).join("")}</select>
    <label id="personLabel">${kind==="収入"?"受け取った人":"支払った人"}</label>
    <input id="f_payer" value="${esc(r?.payer||"大和")}" placeholder="${kind==="収入"?"誰が受け取ったか":"誰が支払ったか"}">
    <label>支払先・受取先</label><input id="f_payee" value="${esc(r?.payee||"")}" placeholder="例：エネオス、○○家">
    <label>用途・目的</label><input id="f_purpose" value="${esc(r?.purpose||"")}" placeholder="例：ガソリン、お供え、御霊前">
    <label>支払方法</label><select id="f_method">${METHODS.map(a=>`<option ${a===(r?.method||"現金")?"selected":""}>${a}</option>`).join("")}</select>
    <label>お金の場所（残高・引落元）</label>
    <select id="f_location">${LOCATIONS.map(a=>`<option ${a===(r?.location||"現金")?"selected":""}>${a}</option>`).join("")}</select>
    <div class="note">「支払方法」はどう払ったか、「お金の場所」は実際にどの現金・口座・残高から出たかを記録します。</div>
    <label>状態</label><select id="f_status" onchange="toggleReason()"><option ${r?.status!=="未確定"?"selected":""}>確定</option><option ${r?.status==="未確定"?"selected":""}>未確定</option></select>
    <div id="reasonBox" class="${r?.status==="未確定"?"":"hidden"}"><label>未確定の理由</label>
      <select id="f_reason"><option>ETC・後日請求</option><option>クレジットカード</option><option>金額未確定</option><option>立替・未返済</option><option>その他</option></select>
    </div>
    <label>立替</label><select id="f_advance" onchange="toggleAdvanceDirection()"><option value="0" ${!r?.advance?"selected":""}>なし</option><option value="1" ${r?.advance?"selected":""}>あり</option></select>
    <div id="advanceDirectionBox" class="${r?.advance?"":"hidden"}">
      <label>立替の方向</label>
      <select id="f_advanceDirection">
        ${["教会 → 大和","大和 → 教会","セレナ → 大和","大和 → セレナ","その他の会計 → 大和","大和 → その他の会計"].map(a=>`<option ${a===(r?.advanceDirection||((r?.account||"教会")==="教会"?"教会 → 大和":"大和 → 教会"))?"selected":""}>${a}</option>`).join("")}
      </select>
    </div>
    <label>メモ</label><textarea id="f_note" placeholder="必要なら記録しておきたいことを">${esc(r?.note||"")}</textarea>
    <div class="form-actions"><button class="cancel" id="cancelFormBtn" type="button">キャンセル</button><button class="save" id="saveFormBtn" type="button">保存</button></div>
    ${r?`<button class="cancel danger" style="width:100%;margin-top:10px" onclick="deleteRecord('${r.id}')">この記録を削除</button>`:""}
  </div>`;

  // Safariでも確実に反応するよう、保存・キャンセルをイベントで登録
  document.getElementById("saveFormBtn").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    saveForm();
  });
  document.getElementById("cancelFormBtn").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    currentTab="records";
    render();
  });
}
function setKind(k){
  document.getElementById("f_kind").value=k;
  document.querySelectorAll(".type button").forEach(b=>b.classList.toggle("active",b.textContent===k));
  document.getElementById("personLabel").textContent=k==="収入"?"受け取った人":"支払った人";
}
function toggleReason(){document.getElementById("reasonBox").classList.toggle("hidden",document.getElementById("f_status").value!=="未確定")}
function toggleAdvanceDirection(){
  const box=document.getElementById("advanceDirectionBox");
  if(box) box.classList.toggle("hidden",document.getElementById("f_advance").value!=="1");
}
function saveForm(){
  const amount=Number(document.getElementById("f_amount").value);
  if(!amount){alert("金額を入力してください。");return}
  const obj={
    id:editingId||Date.now(), date:document.getElementById("f_date").value,
    kind:document.getElementById("f_kind").value, amount,
    account:document.getElementById("f_account").value,payer:document.getElementById("f_payer").value.trim(),
    payee:document.getElementById("f_payee").value.trim(),purpose:document.getElementById("f_purpose").value.trim(),
    method:document.getElementById("f_method").value,location:document.getElementById("f_location").value,
    status:document.getElementById("f_status").value,
    reason:document.getElementById("f_status").value==="未確定"?document.getElementById("f_reason").value:"",
    advance:document.getElementById("f_advance").value==="1",
    advanceDirection:document.getElementById("f_advance").value==="1"?document.getElementById("f_advanceDirection").value:"",
    note:document.getElementById("f_note").value.trim()
  };
  if(editingId) records=records.map(x=>x.id==editingId?obj:x); else records.push(obj);
  save();
  editingId=null;
  currentTab="records";
  currentFilter="すべて";
  currentDate=obj.date;
  render();
}
function deleteRecord(id){if(confirm("この記録を削除しますか？")){records=records.filter(x=>x.id!=id);save();render()}}
function renderAccounts(){
  const totals={}; ACCOUNTS.forEach(a=>totals[a]={in:0,out:0});
  records.forEach(r=>{if(!totals[r.account])totals[r.account]={in:0,out:0}; if(r.kind==="収入")totals[r.account].in+=r.amount; else if(r.kind==="支出")totals[r.account].out+=r.amount});
  let html=`<div class="section"><h2>会計</h2><div class="note">会計は「誰のお金・何の目的のお金か」を分けて管理します。</div>`;
  ACCOUNTS.forEach(a=>html+=`<div class="stat"><b>${a}</b><br><span class="small">収入 ${yen(totals[a].in)}　支出 ${yen(totals[a].out)}</span><br><strong>差引 ${yen(totals[a].in-totals[a].out)}</strong></div>`);
  html+=`</div>`; document.getElementById("main").innerHTML=html;
}
function renderSummary(){
  const unsettled=records.filter(r=>r.status==="未確定");
  const advance=records.filter(r=>r.advance);
  const total=r=>r.reduce((s,x)=>s+x.amount,0);
  document.getElementById("main").innerHTML=`<div class="section"><h2>集計</h2>
    <div class="stat">未確定<br><b>${yen(total(unsettled))}</b><br><span class="small">${unsettled.length}件</span></div>
    <div class="stat">立替<br><b>${yen(total(advance))}</b><br><span class="small">${advance.length}件</span></div>
    <div class="stat">記録件数<br><b>${records.length}件</b></div>
  </div>`;
}
function renderSearch(){
  document.getElementById("main").innerHTML=`<div class="panel"><h2>検索</h2>
  <input id="q" placeholder="支払先・用途・会計・人など" oninput="doSearch()" autofocus>
  <div id="results" style="margin-top:12px"></div></div>`;
}
function doSearch(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const rs=records.filter(r=>[r.account,r.payer,r.payee,r.purpose,r.method,r.location,r.reason,r.note].join(" ").toLowerCase().includes(q));
  document.getElementById("results").innerHTML=rs.length?rs.map(r=>recordCard(r)).join(""):`<div class="empty">${q?"該当する記録はありません。":"検索語を入力してください。"}</div>`;
}
function renderSettings(){
  document.getElementById("main").innerHTML=`<div class="section"><h2>設定</h2>
    <div class="stat"><b>データ</b><br><span class="small">現在 ${records.length}件の記録があります。データはこの端末のブラウザに保存されます。</span></div>
    <button class="primary" onclick="exportData()">バックアップ保存</button>
    <button class="primary" onclick="importData()">バックアップ復元</button>
    <button class="primary danger" onclick="clearAll()">全データを削除</button>
    <p class="note">今は試作版です。大切な記録は、定期的に「バックアップ保存」してください。GitHub上には入力データは保存されません。</p>
  </div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="会計まとめ_バックアップ.json";a.click();
}
function importData(){
  const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
  input.onchange=()=>{const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{records=JSON.parse(rd.result);save();render();alert("復元しました。");}catch(e){alert("バックアップファイルを読み込めませんでした。")}};rd.readAsText(f)};
  input.click();
}
function clearAll(){if(!records.length){alert("削除する記録はありません。");return;} if(confirm(`この端末に保存されている ${records.length}件の記録をすべて削除します。

この操作は元に戻せません。
バックアップが必要なら先に保存してください。`)){records=[];save();currentDate=today();currentTab="records";render();}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()});
render();
</script>
</body>
</html>
