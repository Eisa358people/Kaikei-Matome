function openAccountManagement(){
  currentTab="accounts";
  accountView="active";
  render();
}
function closeSettings(){currentTab="records";render();}
function setStoreReward(index,value){const name=customStores[index];storeRewards[name]=value;savePaymentSettings();renderSettings();}
function addSettingItem(type){
  const labels={store:"購入先の名前",method:"支払方法の名前",point:"ポイントサービスの名前",purpose:"用途・目的の名前"};
  const value=prompt(labels[type]+"を入力してください。"); if(!value||!value.trim())return;
  const v=value.trim(); let arr=type==="store"?customStores:type==="method"?customMethods:type==="point"?pointServices:customPurposes;
  if(arr.includes(v)){alert("同じ名前がすでに登録されています。");return;}
  arr.push(v); if(type==="store"&&!storeRewards[v])storeRewards[v]="還元なし"; savePaymentSettings(); renderSettings();
}
function removeSettingItem(type,index){
  const arr=type==="store"?customStores:type==="method"?customMethods:type==="point"?pointServices:customPurposes;
  const value=arr[index]; if(!confirm("「"+value+"」を候補一覧から削除しますか？\n過去の記録そのものは削除されません。"))return;
  arr.splice(index,1);savePaymentSettings();renderSettings();
}
function downloadJsonFile(data,filename){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportData(){
  // Full backup: preserve all app data, including events that are stored separately.
  const eventData={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key&&key.startsWith(EVENT_DATA_PREFIX))eventData[key]=JSON.parse(localStorage.getItem(key)||"null");
    }
  }catch(e){alert("行事データの確認に失敗したため、バックアップを中止しました。");return;}
  const backup={
    format:"kaikei_matome_backup_v8",createdAt:new Date().toISOString(),
    records,collections,customAccounts,archivedAccounts,hiddenAccounts,customStores,customMethods,
    pointServices,storeRewards,customPurposes,monthlyBudgets,
    defaultAccounts:DEFAULT_ACCOUNTS,accountOrder,budgetEnabledAccounts,
    eventItems,eventData,danData:JSON.parse(localStorage.getItem(DAN_KEY)||"null")
  };
  downloadJsonFile(backup,"会計まとめ_全体バックアップ_"+today()+".json");
}
// 会計別引き継ぎ：ダウンロードをユーザー操作のクリック内で同期的に実行する
// （非同期処理を挟むとブラウザがダウンロードをブロックする場合があるため）
function exportAccountData(){
  try{
    const defaults=Array.isArray(DEFAULT_ACCOUNTS)?DEFAULT_ACCOUNTS:[];
    const customs=Array.isArray(customAccounts)?customAccounts:[];
    const archived=Array.isArray(archivedAccounts)?archivedAccounts.map(a=>typeof a==="string"?a:(a&&a.name)||""):[];
    const names=[...new Set([...defaults,...customs,...archived].filter(n=>typeof n==="string"&&n.trim()).map(n=>n.trim()))];
    if(!names.length){alert("引き継ぎ対象の会計が見つかりません。先に「会計項目の作成・管理」で会計を登録してください。");return;}
    const dialog=document.createElement("dialog");
    dialog.style.cssText="border:1px solid #dfe7ef;border-radius:14px;max-width:360px;width:calc(100% - 32px);padding:20px;font-size:17px";
    const title=document.createElement("h3");title.textContent="引き継ぐ会計を選択";
    const note=document.createElement("p");note.textContent="選択した会計の記録だけをファイルに保存します。";
    const choice=document.createElement("select");choice.style.cssText="width:100%;font-size:18px;padding:10px;margin:12px 0";
    names.forEach(name=>{const option=document.createElement("option");option.value=name;option.textContent=name;choice.appendChild(option);});
    const cancel=document.createElement("button");cancel.type="button";cancel.textContent="キャンセル";
    const next=document.createElement("button");next.type="button";next.textContent="この会計を選ぶ";next.className="primary";
    const actions=document.createElement("div");actions.style.cssText="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap";actions.append(cancel,next);
    dialog.append(title,note,choice,actions);document.body.appendChild(dialog);
    const closeDialog=()=>{try{if(dialog.open)dialog.close();}catch(_){}dialog.remove();};
    cancel.addEventListener("click",closeDialog);
    dialog.addEventListener("cancel",e=>{e.preventDefault();closeDialog();});
    next.addEventListener("click",()=>{
      const accountName=choice.value;
      const sourceRecords=Array.isArray(records)?records:[];
      const accountRecords=sourceRecords.filter(r=>r&&r.account===accountName);
      const packageData={format:"kaikei_matome_account_transfer_v1",createdAt:new Date().toISOString(),accountName,records:accountRecords,note:"会計別引き継ぎファイル。全体設定・他の会計・行事管理データは含みません。"};
      if(!confirm(`「${accountName}」の引き継ぎファイルを作成します。\n\n対象記録：${accountRecords.length}件\n\n個人情報を含む記録がないか確認し、必要な相手にだけ送ってください。\n\n作成しますか？`))return;
      const safeName=accountName.replace(/[\\/:*?"<>|]/g,"_");
      downloadJsonFile(packageData,safeName+"_会計引き継ぎ_"+today()+".json");
      closeDialog();
      alert(`「${accountName}」の引き継ぎファイル作成を実行しました。ダウンロード一覧をご確認ください。`);
    });
    if(typeof dialog.showModal==="function")dialog.showModal();else dialog.setAttribute("open","");
  }catch(e){console.error("会計別引き継ぎファイル作成エラー",e);alert("会計別の引き継ぎファイルを作成できませんでした。\n"+(e&&e.message?e.message:"不明なエラー"));}
}
// 設定パネルが innerHTML で再構築されても反応する委譲クリック
 document.addEventListener("click",function(event){
  const button=event.target&&event.target.closest?event.target.closest("#exportAccountTransferBtn"):null;
  if(!button)return;
  event.preventDefault();event.stopPropagation();exportAccountData();
 },true);

function importData(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json,application/json";
  input.onchange=()=>{
    const f=input.files&&input.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onerror=()=>alert("ファイルを読み込めませんでした。ファイルアプリからJSONファイルを選び直してください。");
    rd.onload=()=>{
      try{
        const raw=String(rd.result||"").replace(/^\\uFEFF/,"").trim();
        const data=JSON.parse(raw);
        const importedRecords=Array.isArray(data)?data:(data&&Array.isArray(data.records)?data.records:null);
        if(!importedRecords)throw new Error("このJSONには records 配列がありません");
        if(!importedRecords.every(r=>r&&typeof r==="object"&&r.date!==undefined&&r.kind!==undefined&&r.amount!==undefined))
          throw new Error("記録データの形式が現在のアプリと一致しません");
        const isAccountTransfer=data&&data.format==="kaikei_matome_account_transfer_v1";
        if(isAccountTransfer&&(!data.accountName||typeof data.accountName!=="string"))throw new Error("会計別引き継ぎファイルに会計名がありません");
        const transferAccountName=isAccountTransfer?data.accountName.trim():"";
        if(!confirm(isAccountTransfer
          ?`引き継ぎファイル「${f.name}」を読み込みます。\n\n会計名：${transferAccountName}\n記録件数：${importedRecords.length}件\n\n現在の記録は削除せず、同じ内容の記録を重複登録しないように追加します。他の会計や設定は置き換えません。\n\n続けますか？`
          :`バックアップ「${f.name}」から ${importedRecords.length}件の記録を取り込みます。\n\n現在の記録は削除せず、バックアップの記録と統合します。同じ内容の記録は重複登録を避けます。念のため、先に現在のデータもバックアップ保存することをおすすめします。\n\n続けますか？`))return;
        // 現在の記録を残したまま、バックアップの記録を安全に統合する。
        // 完全に同じ内容の記録だけを重複として除外し、日付・金額だけでは判定しない。
        const canonicalRecord = value => {
          if(Array.isArray(value))return '['+value.map(canonicalRecord).join(',')+']';
          if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+canonicalRecord(value[k])).join(',')+'}';
          return JSON.stringify(value);
        };
        // 復元直前の保存領域も読み直し、メモリ上の記録と合わせて保護する。
        const mergedRecords=[];
        const knownContents=new Set();
        const addExistingRecord = r => {
          if(!r || typeof r!=='object') return;
          const fingerprint=canonicalRecord(r);
          if(knownContents.has(fingerprint)) return;
          mergedRecords.push(r);
          knownContents.add(fingerprint);
        };
        if(Array.isArray(records)) records.forEach(addExistingRecord);
        try {
          const latestSaved=JSON.parse(localStorage.getItem(KEY)||"[]");
          if(Array.isArray(latestSaved)) latestSaved.forEach(addExistingRecord);
        } catch(storageReadError) {
          console.warn("保存済み記録の再読み込みに失敗しました。メモリ上の記録を使用します。",storageReadError);
        }
        const usedIds=new Set(mergedRecords.filter(r=>r&&r.id!==undefined&&r.id!==null).map(r=>String(r.id)));
        let addedCount=0,duplicateCount=0;
        for(const sourceRecord of importedRecords){
          const record={...sourceRecord};
          const fingerprint=canonicalRecord(record);
          if(knownContents.has(fingerprint)){duplicateCount++;continue;}
          if(record.id!==undefined&&record.id!==null&&usedIds.has(String(record.id))){
            // 同じIDでも内容が異なる場合は、既存記録を上書きせず別IDにする。
            let newId=Date.now();
            while(usedIds.has(String(newId)))newId++;
            record.id=newId;
          }
          if(record.id!==undefined&&record.id!==null)usedIds.add(String(record.id));
          mergedRecords.push(record);
          knownContents.add(canonicalRecord(record));
          addedCount++;
        }
        records=mergedRecords;
        if(!Array.isArray(data)&&!isAccountTransfer){
          if(Array.isArray(data.collections))collections=data.collections;
          if(Array.isArray(data.customAccounts))customAccounts=data.customAccounts;
          if(Array.isArray(data.archivedAccounts))archivedAccounts=data.archivedAccounts;
          if(Array.isArray(data.hiddenAccounts))hiddenAccounts=data.hiddenAccounts;
          if(Array.isArray(data.customStores))customStores=data.customStores;
          if(Array.isArray(data.customMethods))customMethods=data.customMethods;
          if(Array.isArray(data.pointServices))pointServices=data.pointServices;
          if(data.storeRewards&&typeof data.storeRewards==="object")storeRewards=data.storeRewards;
          if(Array.isArray(data.customPurposes))customPurposes=data.customPurposes;
          if(data.monthlyBudgets&&typeof data.monthlyBudgets==="object")monthlyBudgets=data.monthlyBudgets;
          if(Array.isArray(data.defaultAccounts))DEFAULT_ACCOUNTS=data.defaultAccounts;
          if(Array.isArray(data.accountOrder))accountOrder=data.accountOrder;
          if(Array.isArray(data.budgetEnabledAccounts))budgetEnabledAccounts=data.budgetEnabledAccounts;
          if(Array.isArray(data.eventItems)){
            eventItems=data.eventItems;
            localStorage.setItem(EVENTS_KEY,JSON.stringify(eventItems));
          }
          if(data.eventData&&typeof data.eventData==="object"){
            Object.keys(data.eventData).forEach(key=>{
              if(key.startsWith(EVENT_DATA_PREFIX))localStorage.setItem(key,JSON.stringify(data.eventData[key]));
            });
          }
          if(data.danData&&typeof data.danData==="object")localStorage.setItem(DAN_KEY,JSON.stringify(data.danData));
          saveMonthlyBudgets();
          saveBudgetEnabledAccounts();saveAccountOrder();
          saveAccounts();savePaymentSettings();saveCollections();refreshAccounts();
        }
        if(isAccountTransfer){
          if(!DEFAULT_ACCOUNTS.includes(transferAccountName)&&!customAccounts.includes(transferAccountName)){
            customAccounts.push(transferAccountName);saveAccounts();refreshAccounts();
          }
        }
        save();render();alert(`バックアップの取り込みが完了しました。\n\n追加：${addedCount}件\n重複としてスキップ：${duplicateCount}件\n現在の記録を含む合計：${records.length}件`);
      }catch(e){
        console.error("バックアップ復元エラー:",e);
        alert("バックアップファイルを読み込めませんでした。\\n\\nファイル名："+f.name+"\\n原因："+(e&&e.message?e.message:"JSONの形式を確認できません")+"\\n\\n元の記録は変更していません。");
      }
    };
    rd.readAsText(f,"UTF-8");
  };
  input.click();
}
function clearAll(){if(!records.length){alert("削除する記録はありません。");return;} if(confirm(`この端末に保存されている ${records.length}件の記録をすべて削除します。

この操作は元に戻せません。
バックアップが必要なら先に保存してください。`)){records=[];save();currentDate=today();currentTab="records";render();}}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{openAccountMenu="";currentTab=b.dataset.tab;render()});
