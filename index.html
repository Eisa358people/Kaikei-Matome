<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="会計まとめ">
<title>会計まとめ</title>
<style>
:root{--blue:#1683e6;--bluebg:#eef7ff;--line:#e6e9ed;--text:#222;--muted:#737980}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f6f7f8;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{font-size:17px}
.app{width:100%;max-width:430px;min-height:100vh;min-height:100svh;margin:0 auto;background:#fff;padding-bottom:84px}
.header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.header h1{font-size:21px;margin:0;font-weight:700}
.header button{border:0;background:none;color:var(--blue);font-size:30px;line-height:1}
.month{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
.month button{border:0;background:none;color:var(--blue);font-size:30px;padding:8px 14px}
.today{padding:14px 18px;display:flex;justify-content:space-between;font-weight:700}
main{padding:0 14px}
.add{width:100%;min-height:54px;border:1px solid #b9dcfb;border-radius:15px;background:var(--bluebg);color:#126dbb;font-size:19px;font-weight:700}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 1px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{min-height:40px;white-space:nowrap;border:1px solid #d9dfe5;background:#fff;border-radius:20px;padding:0 14px;font-size:15px}
.filters .selected{background:var(--bluebg);border-color:#9bcdf6;color:#126dbb;font-weight:700}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:9px 0;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.small{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.balance{background:#f8fbff}
.balance strong{font-size:20px;color:#126dbb}
.form{margin:10px 0 14px;padding:15px;border:1px solid #dce4eb;border-radius:15px;background:#fbfdff}
.form h2{font-size:20px;margin:0 0 8px}
label{display:block;font-weight:600;margin:10px 0}
input,select{width:100%;min-height:48px;margin-top:5px;padding:10px 12px;border:1px solid #cfd6de;border-radius:10px;background:#fff;font-size:16px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1;min-height:48px;border:1px solid #cfd6de;border-radius:10px;background:#fff;font-size:16px}
.actions .save{background:var(--bluebg);border-color:#9bcdf6;color:#126dbb;font-weight:700}
.hidden{display:none}
.note{font-size:12px;color:#7b8289;line-height:1.6;margin:18px 3px}
.nav{position:fixed;z-index:10;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;padding:7px 4px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;color:#777;min-height:50px;font-size:12px}
.nav .active{color:var(--blue);font-weight:700}
.nav .icon{display:block;font-size:21px;line-height:22px;margin-bottom:2px}
@media(min-width:600px){body{padding:20px}.app{border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}}
</style>
</head>
<body>
<div class="app">
<header class="header"><h1>会計まとめ</h1><button type="button" aria-label="新規記録" onclick="toggleForm()">＋</button></header>
<div class="month"><button type="button" onclick="changeMonth(-1)">‹</button><strong id="month">10月</strong><button type="button" onclick="changeMonth(1)">›</button></div>
<div class="today"><span>8日 木曜日</span><span id="count">3件</span></div>
<main>
<button class="add" type="button" onclick="toggleForm()">＋ 記録する</button>

<div id="form" class="form hidden">
<h2>新しい記録</h2>
<label>種類<select id="kind"><option>支出</option><option>収入</option><option>お金を移す</option></select></label>
<label>金額<input id="amount" inputmode="numeric" placeholder="金額を入力"></label>
<label>会計<select id="account"><option>教会</option><option>少年会</option><option>セレナ</option><option>大和</option></select></label>
<label>支払った人 / 受け取った人<input id="person" placeholder="例：大和"></label>
<label>支払先<input id="payee" placeholder="例：○○商店"></label>
<label>用途<input id="purpose" placeholder="例：ガソリン"></label>
<label>お金の場所<select id="place"><option>現金</option><option>○○銀行</option><option>PayPay</option><option>ポイント</option></select></label>
<div class="actions"><button type="button" onclick="toggleForm()">キャンセル</button><button class="save" type="button" onclick="saveRecord()">保存</button></div>
</div>

<div class="filters">
<button class="selected" type="button" onclick="filterRecords('all',this)">すべて</button>
<button type="button" onclick="filterRecords('教会',this)">教会</button>
<button type="button" onclick="filterRecords('セレナ',this)">セレナ</button>
<button type="button" onclick="filterRecords('立替',this)">立替</button>
<button type="button" onclick="filterRecords('未確定',this)">未確定</button>
</div>

<section id="records">
<div class="card" data-tags="教会"><div class="row"><span>⛩️ 教会</span><strong>5,000円</strong></div><div class="small">ガソリン　｜　大和が支払い　｜　現金</div></div>
<div class="card" data-tags="立替"><div class="row"><span>👤 大和 → 教会</span><strong>3,000円</strong></div><div class="small">教会への立て替え　｜　未精算</div></div>
<div class="card" data-tags="未確定"><div class="row"><span>📱 携帯会社</span><strong>5,000円</strong></div><div class="small">通信費・書籍・ゲーム　｜　未確定</div></div>
</section>

<div class="card balance"><div class="row"><span>大和への立て替え分（教会のお金）</span><strong>12,500円</strong></div><div class="small">教会のお金を大和さんが管理・使用中</div></div>
<div class="card"><div class="row"><span>🚗 私用車</span><strong>今月 420km</strong></div><div class="small">塾 40km　｜　個人 30km　｜　教会 350km（自動計算）</div></div>
<p class="note">第1号・操作確認用。入力内容はページを閉じると消えます。実際の重要な会計データはまだ入力しないでください。</p>
</main>

<nav class="nav">
<button class="active" type="button"><span class="icon">✎</span>記録</button>
<button type="button"><span class="icon">▦</span>会計</button>
<button type="button"><span class="icon">◔</span>集計</button>
<button type="button"><span class="icon">⌕</span>検索</button>
<button type="button"><span class="icon">⚙</span>設定</button>
</nav>
</div>
<script>
let month=10;
function changeMonth(d){month=Math.min(12,Math.max(1,month+d));document.getElementById('month').textContent=month+'月'}
function toggleForm(){document.getElementById('form').classList.toggle('hidden')}
function saveRecord(){
 const amount=Number(document.getElementById('amount').value.replace(/,/g,''));
 if(!Number.isFinite(amount)||amount<=0){alert('金額を入力してください');return}
 const kind=document.getElementById('kind').value, account=document.getElementById('account').value;
 const person=document.getElementById('person').value.trim()||'未入力', payee=document.getElementById('payee').value.trim()||'支払先未入力';
 const purpose=document.getElementById('purpose').value.trim()||'用途未入力', place=document.getElementById('place').value;
 const div=document.createElement('div'); div.className='card'; div.dataset.tags=account;
 div.innerHTML='<div class="row"><span>📝 '+kind+'｜'+account+'</span><strong>'+amount.toLocaleString()+'円</strong></div><div class="small">'+payee+'　｜　'+purpose+'　｜　'+person+'　｜　'+place+'</div>';
 document.getElementById('records').prepend(div);
 document.getElementById('count').textContent=document.querySelectorAll('#records .card').length+'件';
 ['amount','person','payee','purpose'].forEach(id=>document.getElementById(id).value=''); toggleForm();
}
function filterRecords(tag,btn){
 document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');
 document.querySelectorAll('#records .card').forEach(card=>card.style.display=(tag==='all'||card.dataset.tags.includes(tag)||card.textContent.includes(tag))?'block':'none');
}
</script>
</body>
</html>
