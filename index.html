<title>会計まとめ</title>
<style>
:root{
  --blue:#1683e6; --bluebg:#eaf6ff; --line:#dfe7ef;
  --text:#222; --muted:#6d7782; --yellow:#fff7cf;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f5f7fa;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{font-size:17px}
.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:#fff;padding-bottom:82px}
header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:21px;margin:0}.header-pencil{display:inline-block;width:27px;height:27px;margin-left:7px;vertical-align:-5px;transform:none}
.iconbtn{border:0;background:none;color:var(--blue);font-size:30px;line-height:1;padding:0 4px}
.month{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}
.month button{border:0;background:none;color:var(--blue);font-size:32px;line-height:1;padding:10px 14px;min-width:54px}
.month strong{font-size:20px}
.daybar{display:flex;justify-content:space-between;padding:12px 18px 8px;font-weight:700}
.daybar span:last-child{font-size:15px;color:var(--muted)}
.primary{display:block;width:calc(100% - 28px);margin:8px 14px 14px;border:0;border-radius:13px;
  background:#dff2ff;color:#0874d1;font-size:20px;font-weight:700;padding:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid #d5dee8;background:#fff;border-radius:22px;padding:8px 15px;font-size:15px}.card .filter{font-size:16px;padding:8px 14px}
/* ホーム画面：記録ボタンの下を少し見やすく */
.home-action{font-size:17px!important;padding:10px 15px!important}
.filters .filter{font-size:16px;padding:9px 16px}
.home-empty{font-size:18px;line-height:1.65;padding:32px 18px}
.filter.active{background:#e7f4ff;color:#0874d1;border-color:#a9d9ff;font-weight:700}
.badge{display:inline-block;border-radius:14px;padding:3px 8px;font-size:12px;background:#fff0c2;color:#805b00;margin-top:4px}.badge.ok{background:#dff6e8;color:#167447}.badge.warn{background:#fff0c2;color:#805b00}.listline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}button:disabled{opacity:.4}
.card{margin:9px 14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px}

<script>
const KEY="kaikei_matome_records_v3";
// One-time, non-destructive migration: rename the account label "自分" to "大和"
// in known account/settings data while preserving transaction IDs, amounts and notes.
(function migrateSelfAccountToYamato(){
  const keys=[
    KEY,"kaikei_matome_default_accounts_v1","kaikei_matome_accounts_v1",
    "kaikei_matome_archived_accounts_v1","kaikei_matome_hidden_accounts_v1",
    "kaikei_matome_account_order_v1","kaikei_matome_month_budgets_v1",
    "kaikei_matome_budget_enabled_accounts_v1","kaikei_matome_collections_v1"
  ];
  const rename=(v)=>{
    if(Array.isArray(v)) return v.map(rename).filter((x,i,a)=> !(x==="自分" && a.includes("大和")));
    if(v && typeof v==="object"){
      const out={};
      for(const [k,val] of Object.entries(v)){
        const nk=k==="自分"?"大和":k;
        out[nk]=rename(val);
      }
      return out;
    }
    return v==="自分"?"大和":v;
  };
  for(const key of keys){
    const raw=localStorage.getItem(key);
    if(raw===null) continue;
    try { localStorage.setItem(key,JSON.stringify(rename(JSON.parse(raw)))); } catch(e) { /* preserve unrecognized data */ }
  }
})();
const COLLECTION_KEY="kaikei_matome_collections_v1";
let collections=JSON.parse(localStorage.getItem(COLLECTION_KEY)||"[]");
let activeCollectionEditorId=null;
function saveCollections(){localStorage.setItem(COLLECTION_KEY,JSON.stringify(collections));}
const DEFAULT_ACCOUNTS_KEY="kaikei_matome_default_accounts_v1";
let DEFAULT_ACCOUNTS=JSON.parse(localStorage.getItem(DEFAULT_ACCOUNTS_KEY)||"[\"教会\",\"大和\",\"少年会\",\"団長上和費\",\"セレナ\",\"その他\"]");
const ACCOUNT_KEY="kaikei_matome_accounts_v1";
const ARCHIVED_KEY="kaikei_matome_archived_accounts_v1";
const HIDDEN_KEY="kaikei_matome_hidden_accounts_v1"; const ACCOUNT_ORDER_KEY="kaikei_matome_account_order_v1"; let accountOrder=JSON.parse(localStorage.getItem(ACCOUNT_ORDER_KEY)||"[]");
let customAccounts=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"[]");
let archivedAccounts=JSON.parse(localStorage.getItem(ARCHIVED_KEY)||"[]");
let hiddenAccounts=JSON.parse(localStorage.getItem(HIDDEN_KEY)||"[]");
let accountView="active";
let openAccountMenu="";
// ACCOUNTS is the list available for new records. Hidden/archived accounts remain in historical records.
const ACCOUNTS=[...new Set([...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name)])].filter(a=>!hiddenAccounts.includes(a));
function saveAccounts(){localStorage.setItem(ACCOUNT_KEY,JSON.stringify(customAccounts));localStorage.setItem(ARCHIVED_KEY,JSON.stringify(archivedAccounts));localStorage.setItem(HIDDEN_KEY,JSON.stringify(hiddenAccounts));localStorage.setItem(DEFAULT_ACCOUNTS_KEY,JSON.stringify(DEFAULT_ACCOUNTS));}
function accountIsArchived(name){return archivedAccounts.some(a=>a.name===name);}
function orderedAccountNames(names){const unique=[...new Set(names)];return unique.sort((a,b)=>{const ai=accountOrder.indexOf(a),bi=accountOrder.indexOf(b);if(ai<0&&bi<0)return 0;if(ai<0)return 1;if(bi<0)return -1;return ai-bi;});}
function saveAccountOrder(){localStorage.setItem(ACCOUNT_ORDER_KEY,JSON.stringify(accountOrder));}
function moveAccount(name,direction){
  const list=orderedAccountNames([...new Set([...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name)])].filter(a=>!hiddenAccounts.includes(a)));
  const idx=list.indexOf(name), target=idx+direction;
  if(idx<0||target<0||target>=list.length)return;
  [list[idx],list[target]]=[list[target],list[idx]];
  accountOrder=list;saveAccountOrder();refreshAccounts();render();
}
function refreshAccounts(){const refreshed=orderedAccountNames([...new Set([...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name)])].filter(a=>!hiddenAccounts.includes(a)));ACCOUNTS.splice(0,ACCOUNTS.length,...refreshed);}
const METHODS=["現金","口座振替","クレジットカード","デビットカード","振込","PayPay","ICOCA","店舗ポイント","ETC・後日請求","複数の支払方法"];
const LOCATIONS=["現金","教会現金","自分の現金","銀行口座","PayPay残高","ICOCA残高","店舗ポイント","その他"];
const STORE_KEY="kaikei_matome_custom_stores_v1", METHOD_KEY="kaikei_matome_custom_methods_v1", POINT_KEY="kaikei_matome_point_services_v1", REWARD_KEY="kaikei_matome_store_rewards_v1", PURPOSE_KEY="kaikei_matome_custom_purposes_v1";
let customStores=JSON.parse(localStorage.getItem(STORE_KEY)||"[\"トライアル\",\"コメリ\",\"ナフコ\",\"ガソリンスタンド\"]");
let customMethods=JSON.parse(localStorage.getItem(METHOD_KEY)||"[]");
let pointServices=JSON.parse(localStorage.getItem(POINT_KEY)||"[\"コメリポイント\",\"ナフコポイント\",\"トライアルポイント\"]");
let storeRewards=JSON.parse(localStorage.getItem(REWARD_KEY)||"{\"エネオス\":\"現金還元\",\"ガソリンスタンド\":\"店舗ごとに確認\"}");
let customPurposes=JSON.parse(localStorage.getItem(PURPOSE_KEY)||"[\"ガソリン\",\"お供え\",\"御霊前\",\"食費\",\"教会関係\",\"交際費\",\"携帯電話通信費\"]");
function allMethods(){return [...new Set([...METHODS.filter(x=>x!=="店舗ポイント"),...customMethods])];}
function savePaymentSettings(){localStorage.setItem(STORE_KEY,JSON.stringify(customStores));localStorage.setItem(METHOD_KEY,JSON.stringify(customMethods));localStorage.setItem(POINT_KEY,JSON.stringify(pointServices));localStorage.setItem(REWARD_KEY,JSON.stringify(storeRewards));localStorage.setItem(PURPOSE_KEY,JSON.stringify(customPurposes));}
let records=JSON.parse(localStorage.getItem(KEY)||"[]");
const MONTH_BUDGET_KEY="kaikei_matome_month_budgets_v1";
const BUDGET_ENABLED_KEY="kaikei_matome_budget_enabled_accounts_v1";
let monthlyBudgets=JSON.parse(localStorage.getItem(MONTH_BUDGET_KEY)||"{}");
let budgetEnabledAccounts=JSON.parse(localStorage.getItem(BUDGET_ENABLED_KEY)||"null");
function saveMonthlyBudgets(){localStorage.setItem(MONTH_BUDGET_KEY,JSON.stringify(monthlyBudgets));}
function saveBudgetEnabledAccounts(){localStorage.setItem(BUDGET_ENABLED_KEY,JSON.stringify(budgetEnabledAccounts));}
function initializeBudgetEnabledAccounts(){
  if(Array.isArray(budgetEnabledAccounts)) return;
  budgetEnabledAccounts=Object.keys(monthlyBudgets||{});
  if(ACCOUNTS.includes("会長上和関連費用") && !budgetEnabledAccounts.includes("会長上和関連費用")) budgetEnabledAccounts.push("会長上和関連費用");
  budgetEnabledAccounts=budgetEnabledAccounts.filter(isBudgetEligibleAccount);
  saveBudgetEnabledAccounts();
}
function toggleBudgetAccount(name,enabled){
  initializeBudgetEnabledAccounts();
  if(enabled){if(!budgetEnabledAccounts.includes(name))budgetEnabledAccounts.push(name);}
  else {budgetEnabledAccounts=budgetEnabledAccounts.filter(x=>x!==name);}
  saveBudgetEnabledAccounts();renderSettings();
}
function enabledBudgetAccounts(){initializeBudgetEnabledAccounts();return budgetEligibleAccounts().filter(a=>budgetEnabledAccounts.includes(a));}
function currentMonthKey(){return today().slice(0,7);}
function monthExpense(account,month){return records.filter(r=>r.account===account&&r.kind==="支出"&&(r.date||"").slice(0,7)===month).reduce((sum,r)=>sum+Number(r.amount||0),0);}
function isBudgetEligibleAccount(name){
  const n=(name||"").trim();
  return !!n && n!=="団長上和費" && !n.includes("預り") && !accountIsArchived(n) && !hiddenAccounts.includes(n);
}
function budgetEligibleAccounts(){return [...new Set(ACCOUNTS)].filter(isBudgetEligibleAccount);}
function renderBudgetSettingsSummaryHtml(month,account){
  account=account||enabledBudgetAccounts()[0]||"";
  if(!account)return `<p class="note">予算管理が有効な会計がありません。下の一覧で「使う」をONにしてください。</p>`;
  const b=monthlyBudgets[account]?.[month];const spent=monthExpense(account,month);const left=b===undefined?null:Number(b)-spent;const pct=b>0?Math.min(100,Math.round(spent/Number(b)*100)):0;
  return `<div style="margin-top:10px"><b>${esc(month.replace("-","年"))}月</b><div class="small">対象会計：${esc(account)}　／　予算：${b===undefined?"未設定":yen(b)}　／　支出：${yen(spent)}</div>${b===undefined?`<p class="note">この月の予算はまだ設定されていません。</p>`:`<strong style="color:${left<0?'#b42318':'#18794e'}">${left<0?`予算超過 ${yen(-left)}`:`残り ${yen(left)}`}</strong><div style="height:8px;background:#e3e8ee;border-radius:8px;overflow:hidden;margin-top:6px"><div style="height:8px;width:${pct}%;background:${left<0?'#c94b4b':'#399764'}"></div></div><div class="small">使用率 ${b===0?(spent>0?'予算0円・支出あり':'0') :Math.round(spent/Number(b)*100)}%</div>`}<div id="budgetSettingsForm"></div><button type="button" class="filter" style="margin-top:8px" onclick="showMonthlyBudgetForm('${esc(account)}')">この月の予算を設定・変更</button></div>`;
}
function renderBudgetSettingsSummary(){const month=document.getElementById("budgetMonthSelect")?.value||currentMonthKey();const account=document.getElementById("budgetAccountSelect")?.value||enabledBudgetAccounts()[0]||"";const host=document.getElementById("budgetSettingsSummary");if(host)host.innerHTML=renderBudgetSettingsSummaryHtml(month,account);}
function showMonthlyBudgetForm(account){
  const month=document.getElementById("budgetMonthSelect")?.value||currentMonthKey();
  const existing=monthlyBudgets[account]?.[month] ?? "";
  const host=document.getElementById("budgetSettingsForm");
  if(!host)return;
  host.innerHTML=`<div class="stat" style="margin-top:10px"><b>${esc(month.replace("-","年"))}月の予算設定：${esc(account)}</b><label class="field-label">予算金額（円）</label><input id="budgetInput" type="number" min="0" step="1" inputmode="numeric" value="${esc(existing)}" placeholder="例：20000"><div class="account-actions"><button type="button" class="primary" onclick="saveMonthlyBudget('${esc(account)}','${month}')">予算を保存</button><button type="button" class="archive-btn" onclick="document.getElementById('budgetSettingsForm').innerHTML=''">閉じる</button></div></div>`;
}
function saveMonthlyBudget(account,month){
  const input=document.getElementById("budgetInput");
  if(!input)return;
  const raw=input.value.trim();
  if(raw==="" || !Number.isFinite(Number(raw)) || Number(raw)<0){alert("0以上の予算金額を入力してください。");return;}
  if(!monthlyBudgets[account])monthlyBudgets[account]={};
  monthlyBudgets[account][month]=Math.floor(Number(raw));saveMonthlyBudgets();renderSettings();
  alert(`${account}の${month}月の予算を保存しました。`);
}
let currentTab="records", currentFilter="すべて", editingId=null, currentDate=today(), historyReturnToAccounts=false;

const yen=n=>Number(n||0).toLocaleString("ja-JP")+"円";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(records));}
function today(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dateJP(d){const x=new Date(d+"T00:00:00");return `${x.getMonth()+1}月${x.getDate()}日 ${"日月火水木金土"[x.getDay()]}曜日`}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
  if(currentTab==="records") renderRecords();
  if(currentTab==="accounts") renderAccounts();
  if(currentTab==="advance") renderAdvance();
  if(currentTab==="history") renderHistory();
  if(currentTab==="collections") renderCollections();
  if(currentTab==="dan") { eventMode=false; renderDan(); }
  if(currentTab==="events") renderEvents();
  if(currentTab==="eventdetail") renderDan();
  if(currentTab==="summary") renderSummary();
  if(currentTab==="search") renderSearch();

function advanceDirection(r){
  if(r.advanceDirection) return r.advanceDirection;
  const payer=(r.payer||"").trim();
  if(r.account==="教会" && payer==="大和") return "教会 → 大和";
  if(r.account==="大和" && payer==="大和") return "大和 → 教会";
  if(r.account==="セレナ" && payer==="大和") return "セレナ → 大和";
  if(r.account==="大和" && payer) return `大和 → ${payer}`;
  return `${r.account} → ${payer||"相手"}`;
}
function recordCard(r){
  // 立替精算は履歴として残すが、通常の収入・支出とは区別して表示する
  const isAdvanceSettlement=!!r.advanceSettlement || r.kind==="立替精算";
  const sign=isAdvanceSettlement?"":((r.kind==="収入"||r.kind==="振替入金")?"+":"−");
  const badges=[
    r.status==="未確定"?`<span class="badge warn">未確定</span>`:"",
    r.receiptReconciled?`<span class="receipt-status">照合OK</span>`:"",
    r.advance?`<span class="badge warn">立替</span>`:"",
    isAdvanceSettlement?`<span class="badge">精算記録・収支集計対象外</span>`:""
  ].join("");
  const advanceLine=r.advance?`<div class="advance-direction">立替：${esc(advanceDirection(r))}</div>`:"";
  const transferLine=r.kind==="振替出金"?`<div class="advance-direction">振替先：${esc(r.transferTo||"")}</div>`:r.kind==="振替入金"?`<div class="advance-direction">振替元：${esc(r.transferFrom||"")}</div>`:"";
  const dateLine=`<div class="sub">日付：${esc(r.date||"日付未設定")}${r.transferId?"　🔗 ペア振替":""}</div>`;
  const detail=[
    r.payee?`先：${esc(r.payee)}`:"",
    r.purpose?`用途：${esc(r.purpose)}`:"",
    r.method?`方法：${esc(r.method)}`:"",
    r.location?`場所：${esc(r.location)}`:""
  ].filter(Boolean).join("　");
  return `<div class="card">
    <div class="row">
      <label class="select-record"><input type="checkbox" class="record-check" data-id="${r.id}"><span>選択</span></label>
      <div class="amount">${sign}${yen(r.amount)}</div>
    </div>
    <div class="title" style="margin-top:7px">${esc(r.kind)} ${badges}</div>
    <div class="record-account-label">会計：${esc(r.account||"未設定")}</div>
    ${dateLine}
    ${r.payer?`<div class="record-person-line">支払った人・受け取った人：${esc(r.payer)}</div>`:""}
    ${advanceLine}${transferLine}
    <div class="sub">${esc(detail)}</div>
    ${r.note?`<div class="sub">メモ：${esc(r.note)}</div>`:""}
    ${isAdvanceSettlement?`<div class="sub">返済の履歴として保存されています。通常の収入・支出には二重計上されません。</div>`:""}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button type="button" class="filter" onclick="viewRecord('${r.id}')">👁 詳細を見る</button>
      <button type="button" class="filter" onclick="openForm('${r.id}')">✏️ 編集</button>
      ${r.transferId?`<button type="button" class="cancel danger" onclick="deleteRecord('${r.id}')">🗑️ 振替を取り消す（両方削除）</button>`:""}
    </div>
  </div>`;
}

function viewRecord(id){
  const r=records.find(x=>String(x.id)===String(id));
  if(!r){alert("記録が見つかりません。");return;}
  const rows=[
    ["日付",r.date||""],["種類",r.kind||""],["金額",yen(r.amount)],
    ...(r.transferId?[["振替ペア","この記録と相手側の記録は同じ振替です"],["振替相手",r.kind==="振替出金"?(r.transferTo||""):(r.transferFrom||"")]]:[]),
    ["会計",r.account||""],["支払者・受取人",r.payer||""],
    ["購入先・支払先",r.payee||""],["用途・目的",r.purpose||""],
    ["支払方法",r.method||""],["お金の場所",r.location||""],
    ["状態",r.status||"確定"],["未確定の理由",r.reason||""],
    ["立替",r.advance?"あり":"なし"],["立替の方向",r.advance?advanceDirection(r):""],
    ["ポイントサービス",r.pointStore||""],["獲得ポイント",r.pointsEarned?`${r.pointsEarned} pt`:""],
    ["メモ",r.note||""]
  ].filter(([k,v])=>v!=="");
  let breakdown="";
  if(r.paymentBreakdown){
    const pb=r.paymentBreakdown;
    const items=[["現金",pb.cash],["PayPay",pb.paypay],["ICOCA",pb.icoca],["店舗ポイント",pb.points]]
      .filter(([k,v])=>Number(v)>0).map(([k,v])=>`<div class="detail-row"><span>${k}</span><b>${yen(v)}</b></div>`).join("");
    if(items) breakdown=`<h3>支払い内訳</h3>${items}`;
  }
  document.getElementById("main").innerHTML=`<div class="panel"><h2>記録の詳細</h2>
    <div class="detail-list">${rows.map(([k,v])=>`<div class="detail-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>
    ${breakdown}
    <div class="form-actions"><button class="cancel" type="button" onclick="render()">戻る</button><button class="save" type="button" onclick="openForm('${r.id}')">✏️ 編集</button></div>
    ${r.transferId?`<button class="cancel danger" style="width:100%;margin-top:10px" type="button" onclick="deleteRecord('${r.id}')">🗑️ この振替を取り消す（両方の会計から削除）</button><p class="note">振替元の出金と振替先の入金が同時に削除されます。</p>`:`<button class="cancel danger" style="width:100%;margin-top:10px" type="button" onclick="deleteRecord('${r.id}')">この記録を削除</button>`}
  </div>`;
}

function renderRecords(){
  const filtered=records.filter(r=>r.date===currentDate && (
    currentFilter==="すべて" ||
    (currentFilter==="立替" && r.advance) ||
    (currentFilter==="未確定" && r.status==="未確定") ||
    r.account===currentFilter
  ));
  filtered.sort((a,b)=>b.id-a.id);

  const d=new Date(currentDate+"T00:00:00");
  const dateLabel=`${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;

  let html=`<div class="month">
    <button type="button" id="prevDate" aria-label="前の日">‹</button>
    <strong>${dateLabel}${currentDate===today()?`<span class="today-mark">● 今日</span>`:""}</strong>
    <button type="button" id="nextDate" aria-label="次の日">›</button>
  </div>`;
  if(currentDate!==today()){
    html+=`<div style="text-align:center;padding:7px 0 2px">
      <button type="button" class="filter active" id="todayBtn">今日に戻る</button>
    </div>`;
  }
  html+=`<button class="primary" id="recordBtn" type="button">＋ 記録する</button><button class="filter home-action" id="transferBtn" type="button" style="width:100%;margin-top:8px">↔️ 会計間の振替</button><button class="filter home-action" id="receiptBtn" type="button" style="width:100%;margin-top:8px">🧾 レシート照合して登録</button>`;
  html+=`<div class="filters">${[...new Set(["すべて",...ACCOUNTS.filter(a=>!accountIsArchived(a)),"立替","未確定"])].map(f=>`<button class="filter ${currentFilter===f?"active":""}" onclick="setFilter('${esc(f)}')">${esc(f)}</button>`).join("")}</div>`;

  if(!filtered.length){
    html+=`<div class="empty home-empty">${currentDate===today()?"今日":"この日"}の記録はありません。<br>「＋ 記録する」から記録できます。</div>`;
  } else {
    html+=`<div class="daybar"><span>${dateJP(currentDate)}</span><span>${filtered.length}件</span></div>`;
    html+=`<div class="select-toolbar"><button type="button" class="delete-selected" id="deleteSelected" disabled>🗑️ 選択した記録を削除（0件）</button></div>`;
    filtered.forEach(r=>html+=recordCard(r));
  }
  document.getElementById("main").innerHTML=html;

  // 選択した記録だけを削除する
  const checks=[...document.querySelectorAll(".record-check")];
  const deleteSelected=document.getElementById("deleteSelected");
  const updateDeleteButton=()=>{
    const n=document.querySelectorAll(".record-check:checked").length;
    if(deleteSelected){
      deleteSelected.textContent=`🗑️ 選択した記録を削除（${n}件）`;
      deleteSelected.disabled=n===0;
    }
  };
  checks.forEach(ch=>ch.addEventListener("change",updateDeleteButton));
  if(deleteSelected) deleteSelected.addEventListener("click",()=>{
    const ids=checks.filter(c=>c.checked).map(c=>String(c.dataset.id));
    if(!ids.length)return;
    const box=document.createElement("div");
    box.className="delete-confirm";
    box.innerHTML=`<div><b>${ids.length}件を削除しますか？</b><br><span class="small">選択した記録だけが削除されます。この操作は元に戻せません。</span></div>
      <button type="button" class="delete-yes" id="deleteYes">削除する</button>
      <button type="button" class="delete-no" id="deleteNo">やめる</button>`;
    deleteSelected.replaceWith(box);
    document.getElementById("deleteNo").addEventListener("click",()=>render());
    document.getElementById("deleteYes").addEventListener("click",()=>{
      const idSet=new Set(ids);
      records=records.filter(r=>!idSet.has(String(r.id)));
      save();
      render();
    });
  });

  document.getElementById("prevDate").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    moveDate(-1);
  });
  document.getElementById("nextDate").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    moveDate(1);
  });
  const todayBtn=document.getElementById("todayBtn");
  if(todayBtn) todayBtn.addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    goToday();
  });
  document.getElementById("recordBtn").addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation(); openForm();
  });
  document.getElementById("transferBtn")?.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation(); openTransferForm();
  });
  document.getElementById("receiptBtn").addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation(); openReceiptForm();
  });
}
function openReceiptForm(){
  refreshAccounts();
  document.getElementById("main").innerHTML=`<div class="panel">
    <h2>🧾 レシート照合・登録</h2>
    <p class="note">レシートに印字された支払合計を入力し、会計ごとの振り分け額の合計と照合します。税率ごとの内訳入力は不要です。</p>

    <label>購入先</label><input id="receiptStore" list="receiptStores" placeholder="例：コメリ、コスモス"><datalist id="receiptStores">${customStores.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
    <label>レシート合計（税込・実際の支払額）</label><input id="receiptTotal" type="number" inputmode="numeric" min="1" placeholder="例：936">
    <div class="receipt-total" id="receiptCheck">振り分け合計：0円 ／ 差額：未入力</div>
    <h3>会計ごとの振り分け</h3>
    <p class="note">通常は1つの会計だけでOK。教会分と個人分が混ざる場合だけ、行を追加してください。</p>
    <div id="receiptAllocations"><div class="receipt-line"><div><label>会計</label><select class="receipt-account">${ACCOUNTS.map(a=>`<option>${esc(a)}</option>`).join("")}</select></div><div><label>金額（円）</label><input class="receipt-amount" type="number" inputmode="numeric" min="0" value=""></div></div></div>
    <button type="button" class="filter" id="addReceiptAllocation">＋ 振り分け先を追加</button>
    <label>用途・メモ（任意）</label><input id="receiptPurpose" placeholder="例：消耗品、教会分と個人分の混在">
    <div class="form-actions"><button class="cancel" id="receiptCancel" type="button">キャンセル</button><button class="save" id="receiptSave" type="button">照合して登録</button></div>
  </div>`;
  const update=()=>{
    const total=Number(document.getElementById('receiptTotal').value||0);
    const amounts=[...document.querySelectorAll('.receipt-amount')].map(x=>Number(x.value||0));
    const sum=amounts.reduce((a,b)=>a+b,0), diff=total-sum;
    const el=document.getElementById('receiptCheck');
    el.textContent=`レシート合計：${yen(total)} ／ 振り分け合計：${yen(sum)} ／ 差額：${total?yen(diff):'レシート合計を入力'}`;
    el.style.background=total>0&&diff===0?'#e8f7ed':'#fff7e6';
  };
  document.getElementById('receiptTotal').addEventListener('input',update);
  document.querySelectorAll('.receipt-amount').forEach(x=>x.addEventListener('input',update));
  document.getElementById('addReceiptAllocation').addEventListener('click',()=>{
    const wrap=document.getElementById('receiptAllocations');
    const row=document.createElement('div');row.className='receipt-line';
    row.innerHTML=`<div><label>会計</label><select class="receipt-account">${ACCOUNTS.map(a=>`<option>${esc(a)}</option>`).join('')}</select></div><div><label>金額（円）</label><input class="receipt-amount" type="number" inputmode="numeric" min="0"></div>`;
    wrap.appendChild(row);row.querySelector('.receipt-amount').addEventListener('input',update);
  });
  document.getElementById('receiptCancel').addEventListener('click',()=>{currentTab='records';render()});
  document.getElementById('receiptSave').addEventListener('click',()=>{
    const total=Number(document.getElementById('receiptTotal').value||0);
    const rows=[...document.querySelectorAll('#receiptAllocations .receipt-line')].map(row=>({account:row.querySelector('.receipt-account').value,amount:Number(row.querySelector('.receipt-amount').value||0)})).filter(x=>x.amount>0);
    const sum=rows.reduce((a,b)=>a+b.amount,0);
    if(!total||total<1){alert('レシートの合計金額を入力してください。');return;}
    if(!rows.length){alert('振り分け金額を入力してください。');return;}
    if(sum!==total){alert(`金額が一致していません。レシート合計 ${yen(total)}、振り分け合計 ${yen(sum)}、差額 ${yen(total-sum)} です。`);return;}
    const date=document.getElementById('receiptDate').value||today(), store=document.getElementById('receiptStore').value.trim(), purpose=document.getElementById('receiptPurpose').value.trim();
    const receiptId='receipt-'+Date.now()+'-'+Math.floor(Math.random()*10000);
    const created=rows.map((x,i)=>({id:Date.now()+i, date, kind:'支出', amount:x.amount, account:x.account, payer:'大和', payee:store, purpose:purpose||'レシート購入', method:'現金', location:'現金', status:'確定', note:`レシート照合OK（合計${total}円）`, receiptId, receiptTotal:total, receiptAllocation:x.amount, receiptReconciled:true}));
    records.push(...created);save();currentDate=date;currentTab='records';currentFilter='すべて';render();alert(`レシート合計 ${yen(total)} と振り分け合計が一致しました。${created.length}件を登録しました。`);
  });
}

function setFilter(f){currentFilter=f;render()}

function moveDate(offset){
  const parts=currentDate.split("-").map(Number);
  const d=new Date(parts[0], parts[1]-1, parts[2]);
  d.setDate(d.getDate()+offset);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  currentDate=`${y}-${m}-${day}`;
  render();
}

function goToday(){
  currentDate=today();
  render();
}

  <label>振替元（お金を出す会計）</label><select id="t_from">${names.map(a=>`<option>${esc(a)}</option>`).join("")}</select>
  <label>振替先（お金を受け取る会計）</label><select id="t_to">${names.map((a,i)=>`<option ${a===(names.includes("会長上和関連費用")?"会長上和関連費用":names[Math.min(1,names.length-1)])?"selected":""}>${esc(a)}</option>`).join("")}</select>

  <div class="form-actions"><button class="cancel" type="button" onclick="render()">キャンセル</button><button class="save" type="button" id="saveTransferBtn">振替を登録</button></div></div>`;
  document.getElementById("saveTransferBtn").addEventListener("click",saveTransfer);
}
function saveTransfer(){
  const date=document.getElementById("t_date").value||today();
  const from=document.getElementById("t_from").value,to=document.getElementById("t_to").value;
  const amount=Number(document.getElementById("t_amount").value);const note=document.getElementById("t_note").value.trim();
  if(!from||!to||from===to){alert("振替元と振替先は別の会計を選んでください。");return;}
  if(!Number.isFinite(amount)||amount<=0){alert("1円以上の振替金額を入力してください。");return;}
  const transferId="tr_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
  records.push({id:Date.now(),transferId,date,kind:"振替出金",amount,account:from,transferTo:to,payer:"",payee:"会計間振替",purpose:"会計間の振替",method:"振替",location:"",status:"確定",note});

function saveForm(){
  const amount=Number(document.getElementById("f_amount").value);
  if(!amount){alert("金額を入力してください。");return}
  const paymentBreakdown={
    cash:Number(document.getElementById("f_pay_cash")?.value||0),

  };

      records=records.map(x=>x.transferId===old.transferId?{...x,date:obj.date,note:obj.note||x.note}:String(x.id)===String(editingId)?{...old,...obj}:x);
    }else{ records=records.map(x=>String(x.id)===String(editingId)?obj:x); }
  }else records.push(obj);
  save();
  editingId=null;
  currentTab="records";
  currentFilter="すべて";
  currentDate=obj.date;
  render();
}
function deleteRecord(id){
  const target=records.find(x=>String(x.id)===String(id));
  if(!target){alert("削除する記録が見つかりません。");return;}
  if(target.transferId){
    const pair=records.filter(x=>x.transferId===target.transferId);
    const from=pair.find(x=>x.kind==="振替出金");
    const to=pair.find(x=>x.kind==="振替入金");
    const message=`この振替を取り消しますか？\n\n振替元：${from?.account||target.transferFrom||"不明"}\n振替先：${to?.account||target.transferTo||"不明"}\n金額：${yen(target.amount)}\n\n両方の会計の記録が削除されます。この操作は元に戻せません。`;
    if(!confirm(message))return;
    records=records.filter(x=>x.transferId!==target.transferId);
  }else{
    if(!confirm("この記録を削除しますか？\nこの操作は元に戻せません。"))return;
    records=records.filter(x=>String(x.id)!==String(id));
  }
  save();render();
}

function advanceParties(r){
  const parts=String(r.advanceDirection||'').split('→').map(x=>x.trim());
  if(parts.length===2 && parts[0] && parts[1]) return {lender:parts[0],borrower:parts[1]};
  return {lender:r.account||'会計',borrower:r.payer||'相手'};
}
function advanceSettlements(id){return records.filter(x=>String(x.advanceSettlementOf||'')===String(id));}

function settleAdvance(id){
  const r=records.find(x=>String(x.id)===String(id));if(!r)return;
  const remaining=advanceRemaining(r);if(remaining<=0){alert('この立替は精算済みです。');return;}
  const p=advanceParties(r);
  // Use an in-page form instead of prompt(), which may be blocked in embedded previews.
  document.getElementById('main').innerHTML=`<div class="section">
    <h2>返済・精算を登録</h2>
    <p class="note">${esc(p.borrower)}が返す／${esc(p.lender)}が受け取る立替の返済を記録します。元の立替記録は削除されません。</p>
    <div class="stat" style="margin-bottom:12px">立替額：${yen(r.amount)}<br>精算済み：${yen(Number(r.amount||0)-remaining)}<br><strong>残額：${yen(remaining)}</strong></div>

  </div>`;
}
function saveAdvanceSettlement(id){
  const r=records.find(x=>String(x.id)===String(id));if(!r){alert('元の立替記録が見つかりません。');renderAdvance();return;}
  const remaining=advanceRemaining(r);
  const amount=Number(document.getElementById('advanceSettlementAmount')?.value);
  const date=String(document.getElementById('advanceSettlementDate')?.value||'').trim();
  const extraNote=String(document.getElementById('advanceSettlementNote')?.value||'').trim();
  if(!Number.isFinite(amount)||amount<=0||amount>remaining||!Number.isInteger(amount)){alert(`返済額は1円以上、残額 ${yen(remaining)} 以下の整数で入力してください。`);return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('返済日を選択してください。');return;}
  const p=advanceParties(r);
  const settlement={id:Date.now(),date,kind:'立替精算',amount,account:p.borrower,payer:p.borrower,payee:p.lender,purpose:r.purpose||'立替精算',method:'現金',location:'',status:'確定',note:`立替精算：${p.borrower} → ${p.lender}（元の立替記録は保持）${extraNote?'／'+extraNote:''}`,advanceSettlementOf:r.id,advanceSettlement:true};
  records.push(settlement);save();renderAdvance();
  const left=advanceRemaining(r);
  alert(left===0?`${yen(amount)}の返済を記録しました。返済日：${date}。元の立替記録は残したまま、精算済みに移しました。`:`${yen(amount)}の返済を記録しました。返済日：${date}。残額は${yen(left)}です。元の立替記録は残っています。`);

function createAccount(){
  const input=document.getElementById("newAccountName");

  refreshAccounts();
  if([...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name),...hiddenAccounts].includes(name)){alert("同じ名前の会計がすでにあります。");return;}
  customAccounts.push(name);saveAccounts();accountView="active";render();

function toggleAccountMenu(name){openAccountMenu=openAccountMenu===name?"":name;render()}
function editAccountName(oldName){
  openAccountMenu="";
  render();
  const input=prompt("新しい会計名を入力してください。\n過去の記録と振替先の会計名も一緒に変更します。",oldName);
  if(input===null)return;
  const newName=input.trim();
  if(!newName){alert("会計名を空欄にはできません。");return;}
  if(newName===oldName)return;
  const allNames=[...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name),...hiddenAccounts];
  if(allNames.includes(newName)){alert("同じ名前の会計がすでにあります。");return;}
  DEFAULT_ACCOUNTS=DEFAULT_ACCOUNTS.map(a=>a===oldName?newName:a);
  customAccounts=customAccounts.map(a=>a===oldName?newName:a);
  archivedAccounts=archivedAccounts.map(a=>a.name===oldName?{...a,name:newName}:a);
  hiddenAccounts=hiddenAccounts.map(a=>a===oldName?newName:a);
  records=records.map(r=>({...r,account:r.account===oldName?newName:r.account,transferTo:r.transferTo===oldName?newName:r.transferTo,advanceDirection:typeof r.advanceDirection==="string"?r.advanceDirection.replaceAll(oldName,newName):r.advanceDirection}));
  if(Array.isArray(collections))collections=collections.map(c=>({...c,account:c.account===oldName?newName:c.account}));
  saveAccounts();save();
  if(typeof saveCollections==="function")saveCollections();
  refreshAccounts();accountView=accountIsArchived(newName)?"archived":"active";render();
  alert(`会計名を「${oldName}」から「${newName}」に変更しました。関連する記録も更新しました。`);
}
function archiveAccount(name){
  openAccountMenu="";
  render();
  if(records.some(r=>r.account===name && !r.deletedAt)){
    if(!confirm(`「${name}」を保管します。\n\n過去の収支記録は残ります。通常の使用中一覧から外します。よろしいですか？`))return;
  }else if(!confirm(`「${name}」を保管しますか？`))return;
  if(!accountIsArchived(name))archivedAccounts.push({name,archivedAt:new Date().toISOString(),stage:1});
  saveAccounts();render();
}
function restoreAccount(name){
  openAccountMenu="";
  archivedAccounts=archivedAccounts.filter(a=>a.name!==name);
  if(!customAccounts.includes(name) && !DEFAULT_ACCOUNTS.includes(name))customAccounts.push(name);
  saveAccounts();accountView="active";render();
  alert(`「${name}」を復元しました。`);
}
function canPermanentlyDeleteAccount(name){
  // Only user-created accounts with no transaction, transfer, or collection links may be permanently deleted.
  if(!customAccounts.includes(name)) return false;
  const hasRecord=records.some(r=>r && (r.account===name || r.transferTo===name || (typeof r.advanceDirection==="string" && r.advanceDirection.includes(name))));
  const hasCollection=collections.some(c=>c && c.account===name);
  return !hasRecord && !hasCollection;
}
function deleteUnusedAccount(name){
  openAccountMenu="";
  render();
  if(!canPermanentlyDeleteAccount(name)){
    alert("この会計には関連する記録があるか、標準会計のため完全削除できません。過去の記録を守るため、保管して残してください。");
    render(); return;
  }
  if(!confirm(`独立会計「${name}」を完全に削除しますか？\n\nこの会計には取引履歴がないことを確認しました。この操作は元に戻せません。`)) return;
  customAccounts=customAccounts.filter(a=>a!==name);
  archivedAccounts=archivedAccounts.filter(a=>a.name!==name);
  hiddenAccounts=hiddenAccounts.filter(a=>a!==name);
  saveAccounts(); refreshAccounts(); render();
  alert(`独立会計「${name}」を削除しました。`);
}

function beginAccountDelete(name){
  openAccountMenu="";
  const typed=prompt(`第2段階の確認です。\n\n「${name}」を保管済み一覧から除外します。\n収支記録は削除されません。\n\n続行するには会計名をそのまま入力してください。`);
  if(typed!==name){if(typed!==null)alert("会計名が一致しないため、処理を中止しました。");return;}
  if(!confirm(`最終確認：保管済み一覧から「${name}」を除外します。\n\n過去の収支記録は残りますが、会計の管理画面からは見えなくなります。続けますか？`))return;
  archivedAccounts=archivedAccounts.filter(a=>a.name!==name);
  customAccounts=customAccounts.filter(a=>a!==name);
  if(!hiddenAccounts.includes(name))hiddenAccounts.push(name);
  // Hide from account management and new-entry choices, but preserve every transaction record.
  saveAccounts();refreshAccounts();render();
  alert("会計を一覧から除外しました。過去の収支記録は削除していません。バックアップも定期的に保存してください。");
}

function saveCollection(id){
 const eventName=document.getElementById('c_event').value.trim(),person=document.getElementById('c_person').value.trim(),expected=Number(document.getElementById('c_expected').value);
 if(!eventName||!activeIndependentAccounts().includes(eventName)||!person||!Number.isFinite(expected)||expected<=0){alert('独立会計を選び、氏名と予定額を入力してください。');return;}
 const old=id?collections.find(x=>String(x.id)===String(id)):null;
 const paymentInput=document.getElementById('c_payment_amount');

 if(!Number.isFinite(paymentAmount)||paymentAmount<0){alert('今回の入金額を確認してください。0円以上を入力してください。');return;}
 const alreadyPaid=Number(old?.paid||0);
 if(alreadyPaid>expected){alert('予定額はすでに納入された金額以上にしてください。');return;}
 const dueBeforePayment=Math.max(0,expected-alreadyPaid);
 if(paymentAmount>dueBeforePayment){alert(`今回の入金額が残額を超えています。今回入力できる上限は ${yen(dueBeforePayment)} です。`);return;}
 const account=eventName;
 if(old&&(old.payments||[]).length && account!==(old.account||'教会')){alert('すでに入金記録があるため、入金先会計は変更できません。既存の入金記録を確認してから変更してください。');return;}
 const obj={id:old?old.id:Date.now().toString(),eventName,kind:document.getElementById('c_kind').value,person,expected,paid:alreadyPaid,account,payments:old?.payments||[]};
 if(old)collections=collections.map(x=>String(x.id)===String(id)?obj:x);else collections.push(obj);
 if(old && paymentAmount>0){
   const paymentId=Date.now().toString()+Math.floor(Math.random()*1000);
   const record={id:Date.now()+Math.floor(Math.random()*1000),date:today(),kind:'収入',amount:paymentAmount,account,payer:person,payee:'',purpose:eventName+'（'+obj.kind+'）',method:'現金',location:'',status:'確定',note:'納入管理の編集画面から入金登録',collectionId:obj.id,collectionPaymentId:paymentId};
   records.push(record);obj.paid=alreadyPaid+paymentAmount;obj.payments=obj.payments||[];obj.payments.push({id:paymentId,recordId:record.id,amount:paymentAmount,date:record.date,method:record.method});
   collections=collections.map(x=>String(x.id)===String(id)?obj:x);save();
 }
 saveCollections();activeCollectionEditorId=null;render();
 if(old&&paymentAmount>0)alert(`${yen(paymentAmount)}を今回の入金として記録し、会計の収入にも反映しました。`);
}

 const paymentAmount=Number(document.getElementById('c_payment_amount_inline').value||0);

 if((c.payments||[]).length && eventName!==c.eventName){alert('すでに入金記録があるため、行事・目的（独立会計）は変更できません。既存の入金記録を確認してください。');return;}
 if(!person||!Number.isFinite(expected)||expected<=0){alert('氏名と集金予定額を確認してください。');return;}
 if(!Number.isFinite(paymentAmount)||paymentAmount<0){alert('今回の入金額は0円以上で入力してください。');return;}
 const dueBefore=Math.max(0,expected-Number(c.paid||0));
 if(paymentAmount>dueBefore){alert(`今回の入金額が残額を超えています。入力できる上限は${yen(dueBefore)}です。`);return;}
 c.person=person;c.expected=expected;c.eventName=eventName;c.account=account;
 if(paymentAmount>0){

   const record={id:Date.now()+Math.floor(Math.random()*1000),date:today(),kind:'収入',amount:paymentAmount,account,payer:person,payee:'',purpose:c.eventName+'（'+c.kind+'）',method:'現金',location:'',status:'確定',note:'納入管理の編集欄から入金登録',collectionId:c.id,collectionPaymentId:paymentId};
   records.push(record);c.paid=Number(c.paid||0)+paymentAmount;c.payments=c.payments||[];c.payments.push({id:paymentId,recordId:record.id,amount:paymentAmount,date:record.date,method:record.method});save();
 }
 activeCollectionEditorId=null;saveCollections();render();alert(paymentAmount>0?`${yen(paymentAmount)}を入金として登録し、会計にも反映しました。`:'変更を保存しました。');
}
function editCollection(id){showCollectionForm(id)}
function receiveCollection(id){
 const c=collections.find(x=>String(x.id)===String(id));if(!c)return;
 const due=Math.max(0,Number(c.expected||0)-Number(c.paid||0));if(!due){alert('すでに全額納入済みです。');return;}
 const raw=prompt(`「${c.eventName}」\n${c.person}さんの入金額を入力してください。\n残り：${yen(due)}`,String(due));if(raw===null)return;
 const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0||amount>due){alert('入金額を確認してください。残額以下の正の金額を入力してください。');return;}
 const method=prompt('支払方法を入力してください（例：現金、振込、PayPay）','現金');if(method===null)return;
 const date=prompt('入金日を入力してください（YYYY-MM-DD）',today());if(date===null)return;
 const paymentId=Date.now().toString();
 const record={id:Date.now()+Math.floor(Math.random()*1000),date,kind:'収入',amount,account:c.account||'教会',payer:c.person,payee:'',purpose:c.eventName+'（'+c.kind+'）',method:method.trim()||'現金',location:'',status:'確定',note:'納入管理から登録',collectionId:c.id,collectionPaymentId:paymentId};
 records.push(record);c.paid=Number(c.paid||0)+amount;c.payments=c.payments||[];c.payments.push({id:paymentId,recordId:record.id,amount,date,method:record.method});save();saveCollections();render();alert(`${yen(amount)}を納入として記録し、会計の収入にも反映しました。`);
}
function deleteCollection(id){
 const c=collections.find(x=>String(x.id)===String(id));if(!c){alert('削除する納入項目が見つかりません。');return;}
 const linked=records.filter(r=>String(r.collectionId||'')===String(c.id) || (c.payments||[]).some(p=>String(p.recordId||'')===String(r.id)));
 const paid=Number(c.paid||0);
 let message=`「${c.eventName}／${c.person}」を削除しますか？`;
 if(paid>0 || linked.length){
   message+=`\n\nこの項目には納入額 ${yen(paid)} と関連する会計記録 ${linked.length}件があります。`;
   message+='\n納入項目と、それに対応する入金記録を一緒に削除します。';
 }
 message+='\nこの操作は元に戻せません。';
 if(!confirm(message))return;
 if(linked.length){const ids=new Set(linked.map(r=>String(r.id)));records=records.filter(r=>!ids.has(String(r.id)));save();}
 collections=collections.filter(x=>String(x.id)!==String(id));saveCollections();activeCollectionEditorId=null;render();
 alert(linked.length?`納入項目と関連する入金記録${linked.length}件を削除しました。`:'納入項目を削除しました。');
}

function saveBulkCollections(){
 const host=document.getElementById('collectionFormHost');
 const showMessage=(message)=>{let box=document.getElementById('bulkFeedback');if(!box&&host){box=document.createElement('p');box.id='bulkFeedback';box.setAttribute('role','status');box.style.cssText='padding:10px 12px;border-radius:10px;background:#fff7cf;color:#5b4700;font-weight:600';host.prepend(box);}if(box)box.textContent=message;else alert(message);};
 const eventEl=document.getElementById('cb_event');
 const rows=[...document.querySelectorAll('#cb_people_rows .collection-person-row')];
 if(!eventEl||!rows.length){showMessage('登録画面が見つかりません。いったんキャンセルして、もう一度開いてください。');return;}
 const eventName=eventEl.value.trim(), kind=document.getElementById('cb_kind')?.value||'参加費', account=eventName;
 if(!eventName){showMessage('行事・目的を入力してください。');return;}
 const parsed=[]; const bad=[];
 rows.forEach((row,i)=>{
   const person=row.querySelector('.cb-person')?.value.trim()||'';
   const amountText=(row.querySelector('.cb-amount')?.value||'').replace(/[￥¥円,，\s]/g,'');
   if(!person&&!amountText)return;
   const amount=Number(amountText);
   if(!person||!amountText||!Number.isFinite(amount)||amount<=0){bad.push(i+1);return;}
   parsed.push({person,expected:amount});
 });
 if(!parsed.length){showMessage('参加者の名前と金額を少なくとも1人分入力してください。');return;}
 if(bad.length){showMessage(`${bad.join('、')}番目の欄を確認してください。名前と金額の両方を入力してください。`);return;}
 const duplicates=parsed.filter((x,i)=>parsed.findIndex(y=>y.person===x.person)!==i);
 if(duplicates.length&&!confirm('同じ名前が複数あります。このまま登録しますか？'))return;
 const existing=collections.filter(c=>c.eventName===eventName).map(c=>c.person);
 const newPeople=parsed.filter(x=>!existing.includes(x.person));
 if(!newPeople.length){showMessage('この行事には、入力された参加者がすでに登録されています。行事名や氏名をご確認ください。');return;}
 if(newPeople.length!==parsed.length&&!confirm(`既に登録済みの人を除き、${newPeople.length}人を登録しますか？`))return;
 try{
   const now=Date.now(); newPeople.forEach((x,i)=>collections.push({id:String(now+i),eventName,kind,person:x.person,expected:x.expected,paid:0,account,payments:[]}));
   saveCollections();render();alert(`${newPeople.length}人を登録しました。個別の予定額を反映し、入金額は全員0円から開始します。`);
 }catch(err){console.error('一括登録エラー:',err);showMessage('保存できませんでした。ブラウザの保存領域を確認してください。');}
}
function copyCollectionEvent(){
 const names=[...new Set(collections.map(c=>c.eventName))];
 if(!names.length){alert('コピーできる行事がありません。');return;}
 const chosen=prompt('コピー元の行事名を番号で選んでください。\n'+names.map((n,i)=>`${i+1}. ${n}`).join('\n'));
 if(chosen===null)return; const idx=Number(chosen)-1;
 if(!Number.isInteger(idx)||idx<0||idx>=names.length){alert('番号を確認してください。');return;}
 const source=names[idx]; const target=prompt('新しい行事名を入力してください。',source+'（次回）');
 if(target===null)return; if(!target.trim()){alert('新しい行事名を入力してください。');return;}
 const people=collections.filter(c=>c.eventName===source);
 const existing=new Set(collections.filter(c=>c.eventName===target.trim()).map(c=>c.person));
 const fresh=people.filter(c=>!existing.has(c.person));
 if(!fresh.length){alert('コピーできる参加者がいません。既に全員登録済みです。');return;}
 if(!confirm(`「${source}」から${fresh.length}人を「${target.trim()}」へコピーします。予定額・区分・会計先を引き継ぎ、入金額は0円に戻します。よろしいですか？`))return;
 const now=Date.now();fresh.forEach((c,i)=>collections.push({id:String(now+i),eventName:target.trim(),kind:c.kind,person:c.person,expected:Number(c.expected||0),paid:0,account:c.account||'教会',payments:[]}));
 saveCollections();render();alert(`${fresh.length}人分をコピーしました。入金記録は引き継いでいません。`);
}

 const b=e.target.closest('[data-collection-action]'); if(!b)return;

 else if(action==='add-person-row'){const rows=document.getElementById('cb_people_rows');if(rows){const row=document.createElement('div');row.className='collection-person-row';row.style.cssText='display:grid;grid-template-columns:minmax(0,1fr) minmax(100px,0.55fr);gap:8px;align-items:end';row.innerHTML='<div><label>名前</label><input class="cb-person" maxlength="80" placeholder="例：山田さん"></div><div><label>金額（円）</label><input class="cb-amount" type="number" min="1" inputmode="numeric" placeholder="20000"></div>';rows.appendChild(row);}}

});

function renderHistory(){
  refreshAccounts();
  const allNames=[...new Set([...ACCOUNTS,...records.map(r=>r.account).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,"ja"));
  const now=today();
  const monthStart=now.slice(0,8)+"01";
  const params=window.historyFilters||{account:"すべて",period:"今月",start:monthStart,end:now};
  let start=params.start||monthStart, end=params.end||now;
  if(params.period==="今月"){start=monthStart;end=now;}
  if(params.period==="先月"){
    const d=new Date(now+"T00:00:00");d.setDate(1);d.setMonth(d.getMonth()-1);
    start=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
    const last=new Date(d.getFullYear(),d.getMonth()+1,0);end=`${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,"0")}-${String(last.getDate()).padStart(2,"0")}`;
  }
  if(params.period==="今年"){start=now.slice(0,4)+"-01-01";end=now;}
  if(params.period==="全期間"){start="";end=now;}
  const accountOptions=["すべて",...allNames].map(a=>`<option value="${esc(a)}" ${a===params.account?"selected":""}>${esc(a)}</option>`).join("");
  const periodOptions=["今月","先月","今年","全期間","期間指定"].map(a=>`<option ${a===params.period?"selected":""}>${a}</option>`).join("");
  const matches=records.filter(r=>(params.account==="すべて"||r.account===params.account)&&r.date>=start&&r.date<=end).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||Number(b.id)-Number(a.id));
  const totalKind=(kind,rs=matches)=>rs.filter(r=>r.kind===kind).reduce((sum,r)=>sum+Number(r.amount||0),0);
  const income=totalKind("収入"), expense=totalKind("支出"), net=income-expense;
  const upto=records.filter(r=>(params.account==="すべて"||r.account===params.account)&&r.date<=end);
  const balance=totalKind("収入",upto)-totalKind("支出",upto)+upto.filter(r=>r.kind==="振替入金").reduce((s,r)=>s+Number(r.amount||0),0)-upto.filter(r=>r.kind==="振替出金").reduce((s,r)=>s+Number(r.amount||0),0);
  document.getElementById("main").innerHTML=`<div class="section"><div class="settings-heading"><h2>出納履歴</h2>${historyReturnToAccounts?`<button class="settings-close" type="button" onclick="returnToAccountList()">← 会計一覧に戻る</button>`:""}</div>
    <p class="note">会計ごとの収入・支出を、指定した期間で確認できます。会計間の振替は通常の収入・支出合計には含めず、累計差引には反映します。</p>
    <label>会計区分</label><select id="historyAccount">${accountOptions}</select>
    <label>閲覧期間</label><select id="historyPeriod">${periodOptions}</select>
    <p class="note" style="margin:8px 0 0">開始日・終了日を変更する場合は、閲覧期間で「期間指定」を選んでください。</p>
    <div class="history-dates" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
      <div><label>開始日</label><input id="historyStart" type="date" value="${esc(start)}" ${params.period!=="期間指定"?"disabled":""}></div>
      <div><label>終了日</label><input id="historyEnd" type="date" value="${esc(end)}" ${params.period!=="期間指定"?"disabled":""}></div>
    </div>
    <button class="primary" id="applyHistory">この条件で表示</button>
    <div class="stat-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <div class="stat">収入合計<br><b style="color:#16834a">${yen(income)}</b></div>
      <div class="stat">支出合計<br><b style="color:#b42323">${yen(expense)}</b></div>
      <div class="stat">期間内の差引収支<br><b>${net>=0?"＋":"−"}${yen(Math.abs(net))}</b></div>
      <div class="stat">期間終了日までの累計差引<br><b>${balance>=0?"＋":"−"}${yen(Math.abs(balance))}</b></div>
    </div>
    <div class="daybar"><span>${params.period==="全期間"?`全期間 ～ ${esc(end)}`:`${esc(start)} ～ ${esc(end)}`}</span><span>${matches.length}件</span></div>
    <label>履歴内を検索（店名・用途・メモ）</label><input id="historySearch" placeholder="例：コメリ、ガソリン、未照合">
    <div id="historyResults">${matches.length?matches.map(r=>recordCard(r)).join(""):`<div class="empty">この期間の記録はありません。</div>`}</div>
  </div>`;
  document.getElementById("historyPeriod").addEventListener("change",e=>{
    const custom=e.target.value==="期間指定";
    document.getElementById("historyStart").disabled=!custom;
    document.getElementById("historyEnd").disabled=!custom;
  });
  document.getElementById("applyHistory").addEventListener("click",()=>{
    const period=document.getElementById("historyPeriod").value;
    const startValue=document.getElementById("historyStart").value;
    const endValue=document.getElementById("historyEnd").value;
    if(period==="期間指定"&&(!startValue||!endValue||startValue>endValue)){alert("開始日と終了日を確認してください。");return;}
    window.historyFilters={account:document.getElementById("historyAccount").value,period,start:startValue,end:endValue};
    renderHistory();
  });
  document.getElementById("historySearch").addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase();
    const filtered=matches.filter(r=>[r.account,r.payee,r.purpose,r.note,r.payer,r.method].join(" ").toLowerCase().includes(q));
    document.getElementById("historyResults").innerHTML=filtered.length?filtered.map(r=>recordCard(r)).join(""):`<div class="empty">該当する記録はありません。</div>`;
  });
}

const DAN_KEY="kaikei_matome_dansan_v1";
let danData=JSON.parse(localStorage.getItem(DAN_KEY)||"null")||{name:"おぢばがえり団参",startDate:today(),endDate:today(),participants:1,feePerPerson:0,people:[{name:"",fee:0}],expenses:[],churchAdvance:0,personalTravelAdvance:0,extraAdvance:0,repaid:0,advances:[],note:""};
function danMoney(v){return Math.max(0,Number(v)||0);}
function normalizeDanData(){
  if(!Array.isArray(danData.people)){
    const n=Math.max(1,Math.floor(danMoney(danData.participants)||1));
    danData.people=Array.from({length:n},(_,i)=>({name:i===0?"自分":"",fee:danMoney(danData.feePerPerson)}));
  }
  if(!Array.isArray(danData.advances)){
    danData.advances=[];
    const oldTotal=danMoney(danData.churchAdvance)+danMoney(danData.personalTravelAdvance)+danMoney(danData.extraAdvance);
    if(oldTotal>0){
      danData.advances.push({person:"自分",purpose:"以前の立替記録（内訳は旧記録を確認）",amount:oldTotal,repaid:danMoney(danData.repaid),date:today(),note:"旧バージョンから引き継いだ立替額"});
    }
  }
  if(!Array.isArray(danData.expenses))danData.expenses=[];
}
normalizeDanData();
function saveDan(){localStorage.setItem(eventDataKey(),JSON.stringify(danData));if(eventMode&&activeEventId){const ev=eventItems.find(x=>x.id===activeEventId);if(ev){ev.name=danData.name||ev.name;ev.startDate=danData.startDate||ev.startDate;ev.endDate=danData.endDate||ev.endDate;saveEventItems();}}}
function renderDan(){
 const people=danData.people||[];
 const totalCollected=people.reduce((s,p)=>s+danMoney(p.fee),0);
 const totalExpenses=(danData.expenses||[]).reduce((s,x)=>s+danMoney(x.amount),0);
 const totalAdvance=(danData.advances||[]).reduce((s,x)=>s+danMoney(x.amount),0);
 const totalRepaid=(danData.advances||[]).reduce((s,x)=>s+Math.min(danMoney(x.amount),danMoney(x.repaid)),0);
 const remaining=Math.max(0,totalAdvance-totalRepaid);
 const balance=totalCollected-totalExpenses;
 document.getElementById("main").innerHTML=`<div class="panel">
 <h2>${eventMode?"🎉 行事・イベントの記録":"🚌 おぢばがえり団参の記録"}</h2>
 ${eventMode?`<button type="button" class="cancel" onclick="backToEvents()">← 行事一覧へ戻る</button>`:""}
 <div class="note">${eventMode?"この行事専用の記録です。ほかの行事や団参の記録とは混ざりません。":"参加者ごとの参加費、団参全体の経費、対象者・内容ごとの立替を管理します。"} 保存後は入力画面を閉じ、編集ボタンから再開できます。</div>
 <div id="danDisplayControls" style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="cancel" type="button" onclick="editDan()">✏️ 編集</button></div>
 <div id="danEditArea">
 <label>${eventMode?"行事名":"団参名"}</label><input id="dan_name" value="${esc(danData.name)}" placeholder="${eventMode?"例：少年会お泊まり会":"例：おぢばがえり団参"}">
 <div class="grid2"><div><label>${eventMode?"開始日":"出発日"}</label><input id="dan_start" type="date" value="${esc(danData.startDate)}"></div><div><label>${eventMode?"終了日":"帰着日"}</label><input id="dan_end" type="date" value="${esc(danData.endDate)}"></div></div>
 <hr><h3>${eventMode?"参加者・参加費":"参加者ごとの参加費"}</h3><div class="note">${eventMode?"必要な場合に参加者と参加費を登録します。一人ずつ金額を設定できます。":"一人ずつ参加費を入力します。金額が異なっていても大丈夫です。"}</div>
 <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:6px">氏名</th><th style="text-align:left;padding:6px">参加費（円）</th><th></th></tr></thead><tbody id="dan_people_rows">${people.map((x,i)=>`<tr><td style="padding:5px"><input data-dan-person-name="${i}" value="${esc(x.name||"")}" placeholder="参加者名" aria-label="参加者${i+1}の氏名"></td><td style="padding:5px"><input data-dan-person-fee="${i}" type="number" min="0" step="1" value="${danMoney(x.fee)}" aria-label="参加者${i+1}の参加費"></td><td style="padding:5px"><button class="cancel danger" type="button" onclick="removeDanPerson(${i})">削除</button></td></tr>`).join("")}</tbody></table></div>
 <button class="cancel" type="button" onclick="addDanPerson()">＋ 参加者を追加</button>
 <p class="note">参加費合計：<b>${yen(totalCollected)}</b></p>
 <hr><h3>支出・経費</h3><div class="note">${eventMode?"食材費・会場費・交通費など、この行事にかかった費用を登録します。":"フェリー代・交通費・宿泊費・食事代など、団参全体にかかった費用を登録します。"}</div>
 <div id="dan_expenses">${(danData.expenses||[]).map((x,i)=>`<div class="dan-expense" style="border:1px solid var(--line);padding:10px;border-radius:10px;margin:8px 0"><div class="grid2"><div><label>経費の内容</label><input data-dan-exp-name="${i}" value="${esc(x.name)}" placeholder="例：フェリー代"></div><div><label>金額（円）</label><input data-dan-exp-amount="${i}" type="number" min="0" value="${danMoney(x.amount)}"></div></div><button class="cancel danger" type="button" onclick="removeDanExpense(${i})">この経費を削除</button></div>`).join("")}</div>
 <button class="cancel" type="button" onclick="addDanExpense()">＋ 経費を追加</button>
 <hr><h3>${eventMode?"立替金・返済（個別管理）":"教会との立替・返済（個別管理）"}</h3><div class="note">${eventMode?"立替は「誰のために・何のために・いくら」を一件ずつ登録します。返済状況も記録できます。立替金は支出欄と分けて管理します。":"立替は「誰のために・何のために・いくら」を一件ずつ登録します。返済額はその立替の返済合計です。立替金を団参経費に重ねて計上しないよう、経費欄とは分けています。"}</div>
 <div id="dan_advances">${(danData.advances||[]).map((x,i)=>`<div style="border:1px solid var(--line);padding:10px;border-radius:10px;margin:8px 0"><div class="grid2"><div><label>対象者</label><input data-dan-adv-person="${i}" value="${esc(x.person||"")}" placeholder="例：自分、Aさん"></div><div><label>立替内容</label><input data-dan-adv-purpose="${i}" value="${esc(x.purpose||"")}" placeholder="例：旅費、参加費不足分"></div><div><label>立替日</label><input data-dan-adv-date="${i}" type="date" value="${esc(x.date||"")}"></div><div><label>立替額（円）</label><input data-dan-adv-amount="${i}" type="number" min="0" value="${danMoney(x.amount)}"></div><div><label>返済済み合計（円）</label><input data-dan-adv-repaid="${i}" type="number" min="0" value="${danMoney(x.repaid)}"></div><div><label>残額</label><strong style="display:block;padding:10px">${yen(Math.max(0,danMoney(x.amount)-Math.min(danMoney(x.amount),danMoney(x.repaid))))}</strong></div></div><label>メモ</label><input data-dan-adv-note="${i}" value="${esc(x.note||"")}" placeholder="返済日や補足など"><button class="cancel danger" type="button" onclick="removeDanAdvance(${i})">この立替を削除</button></div>`).join("")}</div>
 <button class="cancel" type="button" onclick="addDanAdvance()">＋ 立替を追加</button>
 <label>全体メモ</label><textarea id="dan_note" placeholder="${eventMode?"行事や精算についてのメモ":"団参や精算についてのメモ"}">${esc(danData.note||"")}</textarea>
 <div class="form-actions"><button class="save" type="button" onclick="saveDanForm()">保存</button><button class="cancel" type="button" onclick="cancelDanEdit()">キャンセル</button></div>
 </div>
 <div class="panel"><h2>📊 ${eventMode?"行事の収支・立替状況":"団参の収支・立替状況"}</h2><div class="summary-grid">
 <div class="summary-card"><span>参加者数</span><strong>${people.length}人</strong></div><div class="summary-card"><span>参加費合計</span><strong>${yen(totalCollected)}</strong></div>
 <div class="summary-card"><span>経費合計</span><strong>${yen(totalExpenses)}</strong></div><div class="summary-card"><span>参加費 − 経費</span><strong>${yen(balance)}</strong></div>
 <div class="summary-card"><span>立替合計</span><strong>${yen(totalAdvance)}</strong></div><div class="summary-card"><span>返済済み合計</span><strong>${yen(totalRepaid)}</strong></div><div class="summary-card"><span>立替残額</span><strong>${yen(remaining)}</strong></div>
 </div><p class="note">※参加費合計は参加者ごとの金額を合計しています。立替金は通常の収入・支出には自動登録しません。</p>
 <h3>立替一覧</h3>${danData.advances.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>対象者</th><th>内容</th><th>立替額</th><th>返済済み</th><th>残額</th></tr></thead><tbody>${danData.advances.map(x=>`<tr><td>${esc(x.person||"未設定")}</td><td>${esc(x.purpose||"未設定")}</td><td>${yen(danMoney(x.amount))}</td><td>${yen(Math.min(danMoney(x.amount),danMoney(x.repaid)))}</td><td>${yen(Math.max(0,danMoney(x.amount)-Math.min(danMoney(x.amount),danMoney(x.repaid))))}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">立替記録はありません。</div>'}</div></div>`;
 document.getElementById("danEditArea").style.display=danData.editing===false?"none":"block";
 document.getElementById("danDisplayControls").style.display=danData.editing===false?"flex":"none";
}
function collectDanFields(){
 const get=id=>document.getElementById(id);
 if(get("dan_name"))danData.name=get("dan_name").value.trim()||"おぢばがえり団参";
 if(get("dan_start"))danData.startDate=get("dan_start").value;
 if(get("dan_end"))danData.endDate=get("dan_end").value;
 document.querySelectorAll("[data-dan-person-name]").forEach(el=>{let i=+el.dataset.danPersonName;if(danData.people[i])danData.people[i].name=el.value.trim();});
 document.querySelectorAll("[data-dan-person-fee]").forEach(el=>{let i=+el.dataset.danPersonFee;if(danData.people[i])danData.people[i].fee=danMoney(el.value);});
 document.querySelectorAll("[data-dan-exp-name]").forEach(el=>{const i=Number(el.dataset.danExpName);if(danData.expenses[i])danData.expenses[i].name=el.value.trim();});
 document.querySelectorAll("[data-dan-exp-amount]").forEach(el=>{const i=Number(el.dataset.danExpAmount);if(danData.expenses[i])danData.expenses[i].amount=danMoney(el.value);});
 ["person","purpose","date","amount","repaid","note"].forEach(k=>document.querySelectorAll(`[data-dan-adv-${k}]`).forEach(el=>{let i=+el.dataset["danAdv"+k[0].toUpperCase()+k.slice(1)];if(danData.advances[i])danData.advances[i][k]=k==="amount"||k==="repaid"?danMoney(el.value):el.value.trim();}));
 if(get("dan_note"))danData.note=get("dan_note").value.trim();
}
function addDanPerson(){collectDanFields();danData.people.push({name:"",fee:0});saveDan();renderDan();}
function removeDanPerson(i){collectDanFields();if(danData.people.length<=1){alert("参加者は最低1人必要です。");return;}danData.people.splice(i,1);saveDan();renderDan();}
function addDanExpense(){collectDanFields();danData.expenses.push({name:"",amount:0});saveDan();renderDan();}
function removeDanExpense(i){collectDanFields();danData.expenses.splice(i,1);saveDan();renderDan();}
function addDanAdvance(){collectDanFields();danData.advances.push({person:"",purpose:"",date:today(),amount:0,repaid:0,note:""});saveDan();renderDan();}
function removeDanAdvance(i){collectDanFields();if(!confirm("この立替記録を削除しますか？"))return;danData.advances.splice(i,1);saveDan();renderDan();}
function saveDanForm(){collectDanFields();danData.editing=false;saveDan();renderDan();alert(eventMode?"行事の記録を保存しました。":"団参記録を保存しました。");}
function editDan(){danData.editing=true;renderDan();}
function cancelDanEdit(){if(!confirm("編集内容を保存せず、保存済みの内容に戻しますか？"))return;danData=JSON.parse(localStorage.getItem(eventDataKey())||"null")||danData;danData.editing=false;normalizeDanData();renderDan();}

function renderSummary(){
  const unsettled=records.filter(r=>r.status==="未確定");
  const advance=records.filter(r=>r.advance);
  const total=r=>r.reduce((s,x)=>s+Number(x.amount||0),0);
  const years=[...new Set(records.map(r=>(r.date||"").slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();
  const year=window.reportYear||String(new Date().getFullYear());
  const account=window.reportAccount||"すべての会計";
  const base=records.filter(r=>r.status!=="未確定"&&(r.date||"").startsWith(year)&&(account==="すべての会計"||r.account===account));
  const rows=Array.from({length:12},(_,i)=>{const month=String(i+1).padStart(2,"0"), rs=base.filter(r=>(r.date||"").slice(5,7)===month); const income=total(rs.filter(r=>r.kind==="収入")), expense=total(rs.filter(r=>r.kind==="支出")); const ti=total(rs.filter(r=>r.kind==="振替入金")),to=total(rs.filter(r=>r.kind==="振替出金")); return {month:i+1,income,expense,net:income-expense,transferIn:ti,transferOut:to,count:rs.length};});
  const income=total(base.filter(r=>r.kind==="収入")), expense=total(base.filter(r=>r.kind==="支出"));
  const expenseGroups={}; base.filter(r=>r.kind==="支出").forEach(r=>{const k=r.purpose||"用途未設定";expenseGroups[k]=(expenseGroups[k]||0)+Number(r.amount||0)});
  const entries=Object.entries(expenseGroups).sort((a,b)=>b[1]-a[1]); const colors=["#1683e6","#18a779","#f59e0b","#e85d75","#8b5cf6","#14b8a6","#64748b","#d97706"];
  const sumExpense=entries.reduce((s,x)=>s+x[1],0); let cursor=0; const slices=entries.map(([name,value],i)=>{const start=cursor;cursor+=sumExpense?value/sumExpense*100:0;return `<div class="report-legend"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${colors[i%colors.length]};margin-right:7px"></span>${esc(name)} <b>${yen(value)}</b> <span class="small">${sumExpense?Math.round(value/sumExpense*100):0}%</span></div>`}).join("");
  const pie=sumExpense?`<div class="report-pie" style="background:conic-gradient(${entries.map((e,i)=>{const before=entries.slice(0,i).reduce((s,x)=>s+x[1],0)/sumExpense*100;const after=before+e[1]/sumExpense*100;return `${colors[i%colors.length]} ${before}% ${after}%`}).join(",")})"></div>`:`<div class="empty">支出データがありません。</div>`;
  document.getElementById("main").innerHTML=`<div class="section report-screen"><div class="settings-heading"><h2>集計・会計報告</h2><button class="settings-close" type="button" onclick="currentTab='records';render()">閉じる</button></div><div class="stat"><b>教区提出用</b><p class="note">教会会計だけを対象に、1月〜12月の決算書を作成します。</p><button class="primary" onclick="renderChurchSettlement()">教会決算書を開く</button></div>
    <div class="stat"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>対象年・会計</b><button type="button" class="settings-close" onclick="testPrintButton(event)">🖨 印刷・PDF</button></div><div class="report-controls"><select id="reportYear" aria-label="対象年">${[...new Set([String(new Date().getFullYear()),...years])].map(y=>`<option value="${esc(y)}" ${y===year?"selected":""}>${esc(y)}年</option>`).join("")}</select><select id="reportAccount" aria-label="対象会計"><option ${account==="すべての会計"?"selected":""}>すべての会計</option>${orderedAccountNames([...new Set([...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name),...records.map(r=>r.account)])]).map(a=>`<option value="${esc(a)}" ${a===account?"selected":""}>${esc(a)}</option>`).join("")}</select></div></div>
    <div class="report-totals"><div class="stat"><span class="small">年間収入</span><br><b>${yen(income)}</b></div><div class="stat"><span class="small">年間支出</span><br><b>${yen(expense)}</b></div><div class="stat"><span class="small">収支差引</span><br><b>${yen(income-expense)}</b></div></div>
    <div class="stat"><h3>${esc(year)}年 月別収支表</h3><div class="report-table-wrap"><table class="report-table"><thead><tr><th>月</th><th>収入</th><th>支出</th><th>差引</th></tr></thead><tbody>${rows.map(r=>`<tr><th>${r.month}月</th><td>${r.income.toLocaleString("ja-JP")}</td><td>${r.expense.toLocaleString("ja-JP")}</td><td>${r.net.toLocaleString("ja-JP")}</td></tr>`).join("")}<tr class="report-total-row"><th>年間</th><td>${income.toLocaleString("ja-JP")}</td><td>${expense.toLocaleString("ja-JP")}</td><td>${(income-expense).toLocaleString("ja-JP")}</td></tr></tbody></table></div><p class="note">未確定の記録は除外しています。会計間の振替は収入・支出に含めず、内部振替として扱います。</p></div>
    <div class="stat"><h3>支出の内訳（用途別）</h3><div class="report-chart">${pie}<div>${slices||"<span class='small'>支出データがありません。</span>"}</div></div></div>
    <div class="stat"><h3>記録状況</h3>未確定：<b>${yen(total(unsettled))}</b>（${unsettled.length}件）<br>立替：<b>${yen(total(advance))}</b>（${advance.length}件）<br>全記録：<b>${records.length}件</b></div>
  </div>`;
  document.getElementById("reportYear").addEventListener("change",e=>{window.reportYear=e.target.value;renderSummary()});
  document.getElementById("reportAccount").addEventListener("change",e=>{window.reportAccount=e.target.value;renderSummary()});
}
function testPrintButton(event){
  // Diagnostic: confirm whether the click reaches the HTML handler.
  alert("PDFボタンのクリックは受け取れています。続けて印刷画面を開きます。");
  printReport();
}
function printReport(){
  try {
    // The print dialog must be requested directly from the user's click.
    window.print();
  } catch (e) {
    alert("印刷画面を開けませんでした。Chromeでファイルを開き、Ctrl + Pをお試しください。\n" + (e && e.message ? e.message : ""));
  }
}
function renderChurchSettlement(){
 const years=[...new Set([String(new Date().getFullYear()),...records.map(r=>(r.date||"").slice(0,4)).filter(y=>/^\d{4}$/.test(y))])].sort().reverse();const year=window.churchSettlementYear||String(new Date().getFullYear());const cfg=churchCfg()[year]||{};
 const rs=records.filter(r=>r.account==="教会"&&r.status!=="未確定"&&(r.date||"").startsWith(year)&&!String(r.kind||"").startsWith("振替")&&r.kind!=="立替精算");const sums={};rs.forEach(r=>{if(!["収入","支出"].includes(r.kind))return;const c=r.settlementCategory||guessChurchCat(r);if(c&&c!=="未分類")sums[c]=(sums[c]||0)+Number(r.amount||0)});
 sums["前年度繰越金"]=(sums["前年度繰越金"]||0)+Number(cfg.carry||0);const money=n=>Number(n||0).toLocaleString("ja-JP");const bud=(c)=>{const b=(cfg.budgets||{})[c]||{};return Number(b.budget ?? b.final ?? b.initial ?? 0)};
 const row=c=>`<tr><td>${esc(c)}</td><td><input aria-label="${esc(c)}の予算額" type="number" min="0" class="budget-input" value="${bud(c)||''}" onchange="setChurchBudget('${c}','budget',this.value)"></td><td>${money(sums[c]||0)}</td></tr>`;
 const inc=CHURCH_CATS.収入,exp=CHURCH_CATS.支出;const it=inc.reduce((a,c)=>a+(sums[c]||0),0),et=exp.reduce((a,c)=>a+(sums[c]||0),0);const grouped=Object.entries(CHURCH_GROUPS).map(([g,cs])=>`<tr class="group-row"><th colspan="3">${g}</th></tr>${cs.map(row).join('')}`).join('');
 const unc=rs.filter(r=>["収入","支出"].includes(r.kind)&&(r.settlementCategory||guessChurchCat(r))==="未分類");
 document.getElementById('main').innerHTML=`<div class="section report-screen"><div class="settings-heading"><h2>教会決算書</h2><button class="settings-close" onclick="renderSummary()">集計へ戻る</button></div><div class="stat"><p class="note">教会会計のみ。対象期間は1月1日〜12月31日。未確定記録・会計間振替は除外します。</p><label>対象年</label><select id="churchYear">${years.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select><label>前年度繰越金（円）</label><input type="number" min="0" value="${cfg.carry||''}" onchange="setChurchCfg('${year}','carry',this.value);renderChurchSettlement()"><button type="button" class="settings-close" onclick="testPrintButton(event)">🖨 印刷・PDF</button></div><div class="stat"><h3>${year}年 教会決算書</h3><div class="report-table-wrap"><table class="report-table church-settlement-table"><thead><tr><th>科目</th><th>予算額</th><th>決算額</th></tr></thead><tbody><tr class="group-row"><th colspan="3">収入の部</th></tr>${inc.map(row).join('')}<tr class="report-total-row"><th>収入合計</th><td>${money(inc.reduce((a,c)=>a+bud(c),0))}</td><td>${money(it)}</td></tr><tr class="group-row"><th colspan="3">支出の部</th></tr>${grouped}<tr class="report-total-row"><th>支出合計</th><td>${money(exp.reduce((a,c)=>a+bud(c),0))}</td><td>${money(et)}</td></tr><tr class="report-total-row"><th>剰余金（収入合計−支出合計）</th><td>—</td><td>${money(it-et)}</td></tr></tbody></table></div><p class="note">「機関紙代」「広報宣伝費」等は写真の手書き文字から読み取った仮の科目名です。提出前に正式名称をご確認ください。</p></div><div class="stat"><h3>未分類の記録：${unc.length}件</h3><p class="note">未分類の記録は、通常の記録編集画面から科目を指定してください。</p></div></div>`;
 document.getElementById('churchYear').addEventListener('change',e=>{window.churchSettlementYear=e.target.value;renderChurchSettlement()});

function doSearch(){

  const rs=records.filter(r=>[r.account,r.payer,r.payee,r.purpose,r.method,r.location,r.reason,r.note].join(" ").toLowerCase().includes(q));
  document.getElementById("results").innerHTML=rs.length?rs.map(r=>recordCard(r)).join(""):`<div class="empty">${q?"該当する記録はありません。":"検索語を入力してください。"}</div>`;
}
