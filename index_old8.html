<title>会計まとめ</title>
<style>
:root{
  --blue:#1683e6; --bluebg:#eaf6ff; --line:#dfe7ef;
  --text:#222; --muted:#6d7782; --yellow:#fff7cf;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f5f7fa;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{font-size:17px}
.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:#fff;padding-bottom:82px}
header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:21px;margin:0}.header-pencil{font-size:20px;margin-left:6px;vertical-align:2px}
.iconbtn{border:0;background:none;color:var(--blue);font-size:30px;line-height:1;padding:0 4px}
.month{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}
.month button{border:0;background:none;color:var(--blue);font-size:32px;line-height:1;padding:10px 14px;min-width:54px}
.month strong{font-size:20px}
.daybar{display:flex;justify-content:space-between;padding:12px 18px 8px;font-weight:700}
.daybar span:last-child{font-size:15px;color:var(--muted)}
.primary{display:block;width:calc(100% - 28px);margin:8px 14px 14px;border:0;border-radius:13px;
  background:#dff2ff;color:#0874d1;font-size:20px;font-weight:700;padding:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid #d5dee8;background:#fff;border-radius:22px;padding:8px 15px;font-size:15px}.card .filter{font-size:16px;padding:8px 14px}
.filter.active{background:#e7f4ff;color:#0874d1;border-color:#a9d9ff;font-weight:700}
.badge{display:inline-block;border-radius:14px;padding:3px 8px;font-size:12px;background:#fff0c2;color:#805b00;margin-top:4px}.badge.ok{background:#dff6e8;color:#167447}.badge.warn{background:#fff0c2;color:#805b00}.listline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}button:disabled{opacity:.4}
.card{margin:9px 14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px}
.title{font-weight:700;font-size:17px}.amount{font-weight:800;font-size:19px}
.sub{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5}
.badge{display:inline-block;border-radius:10px;padding:2px 7px;font-size:12px;margin-left:4px}
.badge.warn{background:#fff0c2;color:#8a6100}\n.advance-direction{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:10px;background:#fff4cf;color:#7a5a00;font-weight:800;font-size:15px}.badge.ok{background:#e8f8ec;color:#2b7b40}
.empty{margin:35px 18px;padding:30px 18px;text-align:center;color:var(--muted);border:1px dashed #cbd6df;border-radius:15px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:72px;
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;z-index:10}
nav button{flex:1;border:0;background:none;color:#8a95a0;font-size:13px}
nav button.active{color:var(--blue);font-weight:700}
nav .ico{font-size:22px;display:block;margin-bottom:2px}
.panel{padding:16px}.panel h2{font-size:20px;margin:4px 0 16px}
label{display:block;font-weight:700;margin:14px 0 7px}
input,select,textarea{width:100%;font:inherit;border:1px solid #cfd9e3;border-radius:11px;padding:12px;background:#fff}
textarea{min-height:78px;resize:vertical}
.type{display:flex;gap:8px}.type button{flex:1;padding:11px;border:1px solid #ccd7e1;background:#fff;border-radius:10px;font-size:16px}
.type button.active{background:#e7f4ff;color:#0874d1;border-color:#9ed5ff;font-weight:700}
.form-actions{display:flex;gap:10px;margin-top:20px}.form-actions button{flex:1;padding:13px;border-radius:11px;font-size:18px}
.cancel{border:1px solid #d5dee8;background:#fff}.save{border:0;background:#1683e6;color:#fff;font-weight:700}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
.section{padding:12px 16px}.stat{background:#f7fbff;border:1px solid #d9ebf8;border-radius:14px;padding:14px;margin-bottom:10px}
.stat b{font-size:22px}.small{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.listline{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.danger{color:#c33}
.account-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.account-actions button{border:1px solid #d5dee8;background:#fff;border-radius:10px;padding:9px 12px;font:inherit;font-size:15px}
.account-actions .archive-btn{color:#8a6100;border-color:#e8d99b;background:#fffbed}
.account-actions .restore-btn{color:#16834a;border-color:#b9e3c8;background:#f3fff6}
.account-actions .delete-btn{color:#b42323;border-color:#e3b8b8;background:#fff7f7}
.account-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.account-menu-wrap{position:relative;flex-shrink:0}
.account-menu-toggle{border:1px solid #dfe7ef!important;background:#fff!important;color:#6d7782!important;border-radius:999px!important;padding:2px 11px!important;font-size:22px!important;line-height:1.2!important}
.account-menu{position:absolute;right:0;top:calc(100% + 5px);z-index:4;min-width:190px;padding:6px;background:#fff;border:1px solid #dfe7ef;border-radius:12px;box-shadow:0 6px 20px #00000018}
.account-menu button{display:block;width:100%;text-align:left;border:0!important;background:#fff!important;padding:10px 12px!important;border-radius:8px!important;font-size:15px!important;color:#444!important}
.account-menu button:hover{background:#f5f7fa!important}
.account-form{padding:12px;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#f8fbff}
.today-mark{display:block;margin-top:4px;color:#0874d1;font-size:14px;font-weight:800}
.archived-note{padding:10px 12px;border-radius:10px;background:#fff8df;color:#765700;font-size:14px;margin:10px 0}

/* iPhoneで下部ナビが見やすいように調整 */
nav button {
  font-size: 17px !important;
  line-height: 1.2 !important;
  min-height: 72px;
}
nav .ico {
  font-size: 28px !important;
  margin-bottom: 3px;
}


.select-toolbar{text-align:center;padding:6px 0 8px;}
.delete-selected{padding:8px 14px;border:1px solid #e3b8b8;border-radius:999px;background:#fff;color:#b24a4a;font-size:14px;font-weight:700;}
.delete-selected:disabled{opacity:.45;color:#8a95a0;border-color:#d5dee8;}
.delete-selected:not(:disabled):active{transform:scale(.98);}
.select-record{display:flex;align-items:center;gap:7px;margin:0!important;font-weight:600!important;font-size:14px!important;color:#68727d;}
.select-record input{width:22px;height:22px;margin:0;accent-color:#1683e6;}
.history-dates input:disabled{background:#f0f2f5;color:#777;}
.delete-confirm{margin:0 14px 14px;padding:12px;border:1px solid #e3b8b8;border-radius:14px;background:#fff7f7;text-align:center;}
.delete-confirm button{padding:10px 16px;border-radius:10px;font-size:16px;font-weight:700;margin:5px;}
.delete-yes{border:0;background:#c94b4b;color:#fff;}
.delete-no{border:1px solid #ccd7e1;background:#fff;color:#333;}

.detail-list{border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:12px 0}
.detail-row{display:flex;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.detail-row:last-child{border-bottom:0}
.settings-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.settings-heading h2{font-size:24px;margin:0}
.settings-close{flex-shrink:0;border:1px solid #b8dcf7;border-radius:999px;background:#eaf6ff;color:#0874d1;font-size:16px;font-weight:700;padding:9px 15px;cursor:pointer}
.settings-close:active{transform:scale(.98)}
.detail-row span{color:var(--muted);flex:0 0 38%}
.detail-row b{text-align:right;overflow-wrap:anywhere;white-space:pre-wrap}

</style>
</head>
<body>
<div class="app">
<header>
  <h1>会計まとめ <span class="header-pencil" aria-hidden="true">✏️</span></h1>
</header>

<main id="main"></main>

<nav>
  <button class="active" data-tab="records"><span class="ico">📝</span>記録</button>
  <button data-tab="accounts"><span class="ico">▦</span>会計</button>
  <button data-tab="history"><span class="ico">📒</span>出納履歴</button>
  <button data-tab="collections"><span class="ico">👥</span>納入管理</button>
  <button data-tab="summary"><span class="ico">◔</span>集計</button>
  <button data-tab="search"><span class="ico">⌕</span>検索</button>
  <button data-tab="settings"><span class="ico">⚙</span>設定</button>
</nav>
</div>

<script>
const KEY="kaikei_matome_records_v3";
const COLLECTION_KEY="kaikei_matome_collections_v1";
let collections=JSON.parse(localStorage.getItem(COLLECTION_KEY)||"[]");
function saveCollections(){localStorage.setItem(COLLECTION_KEY,JSON.stringify(collections));}
const DEFAULT_ACCOUNTS=["教会","自分","少年会","団長上和費","セレナ","その他"];
const ACCOUNT_KEY="kaikei_matome_accounts_v1";
const ARCHIVED_KEY="kaikei_matome_archived_accounts_v1";
const HIDDEN_KEY="kaikei_matome_hidden_accounts_v1";
let customAccounts=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"[]");
let archivedAccounts=JSON.parse(localStorage.getItem(ARCHIVED_KEY)||"[]");
let hiddenAccounts=JSON.parse(localStorage.getItem(HIDDEN_KEY)||"[]");
let accountView="active";
let openAccountMenu="";
// ACCOUNTS is the list available for new records. Hidden/archived accounts remain in historical records.
const ACCOUNTS=[...new Set([...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name)])].filter(a=>!hiddenAccounts.includes(a));
function saveAccounts(){localStorage.setItem(ACCOUNT_KEY,JSON.stringify(customAccounts));localStorage.setItem(ARCHIVED_KEY,JSON.stringify(archivedAccounts));localStorage.setItem(HIDDEN_KEY,JSON.stringify(hiddenAccounts));}
function accountIsArchived(name){return archivedAccounts.some(a=>a.name===name);}
function refreshAccounts(){ACCOUNTS.splice(0,ACCOUNTS.length,...new Set([...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name)])).filter(a=>!hiddenAccounts.includes(a));}
const METHODS=["現金","口座振替","クレジットカード","デビットカード","振込","PayPay","ICOCA","店舗ポイント","ETC・後日請求","複数の支払方法"];
const LOCATIONS=["現金","教会現金","自分の現金","銀行口座","PayPay残高","ICOCA残高","店舗ポイント","その他"];
const STORE_KEY="kaikei_matome_custom_stores_v1", METHOD_KEY="kaikei_matome_custom_methods_v1", POINT_KEY="kaikei_matome_point_services_v1", REWARD_KEY="kaikei_matome_store_rewards_v1";
let customStores=JSON.parse(localStorage.getItem(STORE_KEY)||"[\"トライアル\",\"コメリ\",\"ナフコ\",\"ガソリンスタンド\"]");
let customMethods=JSON.parse(localStorage.getItem(METHOD_KEY)||"[]");
let pointServices=JSON.parse(localStorage.getItem(POINT_KEY)||"[\"コメリポイント\",\"ナフコポイント\",\"トライアルポイント\"]");
let storeRewards=JSON.parse(localStorage.getItem(REWARD_KEY)||"{\"エネオス\":\"現金還元\",\"ガソリンスタンド\":\"店舗ごとに確認\"}");
function allMethods(){return [...new Set([...METHODS.filter(x=>x!=="店舗ポイント"),...customMethods])];}
function savePaymentSettings(){localStorage.setItem(STORE_KEY,JSON.stringify(customStores));localStorage.setItem(METHOD_KEY,JSON.stringify(customMethods));localStorage.setItem(POINT_KEY,JSON.stringify(pointServices));localStorage.setItem(REWARD_KEY,JSON.stringify(storeRewards));}
let records=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentTab="records", currentFilter="すべて", editingId=null, currentDate=today();

const yen=n=>Number(n||0).toLocaleString("ja-JP")+"円";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(records));}
function today(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dateJP(d){const x=new Date(d+"T00:00:00");return `${x.getMonth()+1}月${x.getDate()}日 ${"日月火水木金土"[x.getDay()]}曜日`}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
  if(currentTab==="records") renderRecords();
  if(currentTab==="accounts") renderAccounts();
  if(currentTab==="history") renderHistory();
  if(currentTab==="collections") renderCollections();
  if(currentTab==="summary") renderSummary();
  if(currentTab==="search") renderSearch();
  if(currentTab==="settings") renderSettings();
}
function advanceDirection(r){
  if(r.advanceDirection) return r.advanceDirection;
  const payer=(r.payer||"").trim();
  if(r.account==="教会" && payer==="大和") return "教会 → 大和";
  if(r.account==="自分" && payer==="大和") return "大和 → 教会";
  if(r.account==="セレナ" && payer==="大和") return "セレナ → 大和";
  if(r.account==="自分" && payer) return `大和 → ${payer}`;
  return `${r.account} → ${payer||"相手"}`;
}
function recordCard(r){
  const sign=r.kind==="収入"?"+":"−";
  const badges=[
    r.status==="未確定"?`<span class="badge warn">未確定</span>`:"",
    r.advance?`<span class="badge warn">立替</span>`:""
  ].join("");
  const advanceLine=r.advance?`<div class="advance-direction">立替：${esc(advanceDirection(r))}</div>`:"";
  const detail=[
    r.account,
    r.payee?`先：${esc(r.payee)}`:"",
    r.purpose?`用途：${esc(r.purpose)}`:"",
    r.method?`方法：${esc(r.method)}`:"",
    r.location?`場所：${esc(r.location)}`:""
  ].filter(Boolean).join("　");
  return `<div class="card">
    <div class="row">
      <label class="select-record"><input type="checkbox" class="record-check" data-id="${r.id}"><span>選択</span></label>
      <div class="amount">${sign}${yen(r.amount)}</div>
    </div>
    <div class="title" style="margin-top:7px">${esc(r.kind)} ${badges}</div>
    ${advanceLine}
    <div class="sub">${esc(detail)}</div>
    ${r.note?`<div class="sub">メモ：${esc(r.note)}</div>`:""}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button type="button" class="filter" onclick="viewRecord('${r.id}')">👁 詳細を見る</button>
      <button type="button" class="filter" onclick="openForm('${r.id}')">✏️ 編集</button>
    </div>
  </div>`;
}

function viewRecord(id){
  const r=records.find(x=>String(x.id)===String(id));
  if(!r){alert("記録が見つかりません。");return;}
  const rows=[
    ["日付",r.date||""],["種類",r.kind||""],["金額",yen(r.amount)],
    ["会計",r.account||""],["支払者・受取人",r.payer||""],
    ["購入先・支払先",r.payee||""],["用途・目的",r.purpose||""],
    ["支払方法",r.method||""],["お金の場所",r.location||""],
    ["状態",r.status||"確定"],["未確定の理由",r.reason||""],
    ["立替",r.advance?"あり":"なし"],["立替の方向",r.advance?advanceDirection(r):""],
    ["ポイントサービス",r.pointStore||""],["獲得ポイント",r.pointsEarned?`${r.pointsEarned} pt`:""],
    ["メモ",r.note||""]
  ].filter(([k,v])=>v!=="");
  let breakdown="";
  if(r.paymentBreakdown){
    const pb=r.paymentBreakdown;
    const items=[["現金",pb.cash],["PayPay",pb.paypay],["ICOCA",pb.icoca],["店舗ポイント",pb.points]]
      .filter(([k,v])=>Number(v)>0).map(([k,v])=>`<div class="detail-row"><span>${k}</span><b>${yen(v)}</b></div>`).join("");
    if(items) breakdown=`<h3>支払い内訳</h3>${items}`;
  }
  document.getElementById("main").innerHTML=`<div class="panel"><h2>記録の詳細</h2>
    <div class="detail-list">${rows.map(([k,v])=>`<div class="detail-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>
    ${breakdown}
    <div class="form-actions"><button class="cancel" type="button" onclick="render()">戻る</button><button class="save" type="button" onclick="openForm('${r.id}')">✏️ 編集</button></div>
    <button class="cancel danger" style="width:100%;margin-top:10px" type="button" onclick="deleteRecord('${r.id}')">この記録を削除</button>
  </div>`;
}

function renderRecords(){
  const filtered=records.filter(r=>r.date===currentDate && (
    currentFilter==="すべて" ||
    (currentFilter==="立替" && r.advance) ||
    (currentFilter==="未確定" && r.status==="未確定") ||
    r.account===currentFilter
  ));
  filtered.sort((a,b)=>b.id-a.id);

  const d=new Date(currentDate+"T00:00:00");
  const dateLabel=`${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;

  let html=`<div class="month">
    <button type="button" id="prevDate" aria-label="前の日">‹</button>
    <strong>${dateLabel}${currentDate===today()?`<span class="today-mark">● 今日</span>`:""}</strong>
    <button type="button" id="nextDate" aria-label="次の日">›</button>
  </div>`;
  if(currentDate!==today()){
    html+=`<div style="text-align:center;padding:7px 0 2px">
      <button type="button" class="filter active" id="todayBtn">今日に戻る</button>
    </div>`;
  }
  html+=`<button class="primary" id="recordBtn" type="button">＋ 記録する</button>`;
  html+=`<div class="filters">${["すべて","教会","セレナ","立替","未確定"].map(f=>`<button class="filter ${currentFilter===f?"active":""}" onclick="setFilter('${f}')">${f}</button>`).join("")}</div>`;

  if(!filtered.length){
    html+=`<div class="empty">${currentDate===today()?"今日":"この日"}の記録はありません。<br>「＋ 記録する」から記録できます。</div>`;
  } else {
    html+=`<div class="daybar"><span>${dateJP(currentDate)}</span><span>${filtered.length}件</span></div>`;
    html+=`<div class="select-toolbar"><button type="button" class="delete-selected" id="deleteSelected" disabled>🗑️ 選択した記録を削除（0件）</button></div>`;
    filtered.forEach(r=>html+=recordCard(r));
  }
  document.getElementById("main").innerHTML=html;

  // 選択した記録だけを削除する
  const checks=[...document.querySelectorAll(".record-check")];
  const deleteSelected=document.getElementById("deleteSelected");
  const updateDeleteButton=()=>{
    const n=document.querySelectorAll(".record-check:checked").length;
    if(deleteSelected){
      deleteSelected.textContent=`🗑️ 選択した記録を削除（${n}件）`;
      deleteSelected.disabled=n===0;
    }
  };
  checks.forEach(ch=>ch.addEventListener("change",updateDeleteButton));
  if(deleteSelected) deleteSelected.addEventListener("click",()=>{
    const ids=checks.filter(c=>c.checked).map(c=>String(c.dataset.id));
    if(!ids.length)return;
    const box=document.createElement("div");
    box.className="delete-confirm";
    box.innerHTML=`<div><b>${ids.length}件を削除しますか？</b><br><span class="small">選択した記録だけが削除されます。この操作は元に戻せません。</span></div>
      <button type="button" class="delete-yes" id="deleteYes">削除する</button>
      <button type="button" class="delete-no" id="deleteNo">やめる</button>`;
    deleteSelected.replaceWith(box);
    document.getElementById("deleteNo").addEventListener("click",()=>render());
    document.getElementById("deleteYes").addEventListener("click",()=>{
      const idSet=new Set(ids);
      records=records.filter(r=>!idSet.has(String(r.id)));
      save();
      render();
    });
  });

  document.getElementById("prevDate").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    moveDate(-1);
  });
  document.getElementById("nextDate").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    moveDate(1);
  });
  const todayBtn=document.getElementById("todayBtn");
  if(todayBtn) todayBtn.addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    goToday();
  });
  document.getElementById("recordBtn").addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    openForm();
  });
}
function setFilter(f){currentFilter=f;render()}

function moveDate(offset){
  const parts=currentDate.split("-").map(Number);
  const d=new Date(parts[0], parts[1]-1, parts[2]);
  d.setDate(d.getDate()+offset);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  currentDate=`${y}-${m}-${day}`;
  render();
}

function goToday(){
  currentDate=today();
  render();
}

function openForm(id){
  refreshAccounts();
  editingId=id||null; const r=id?records.find(x=>x.id==id):null;
  const kind=r?.kind||"支出";
  document.getElementById("main").innerHTML=`
  <div class="panel">
    <h2>${r?"記録を編集":"記録する"}</h2>
    <div class="note">この画面で、日付・収入/支出・金額・会計・支払先や用途などを入力し、最後に「保存」を押してください。</div>
    <label>日付</label><input id="f_date" type="date" value="${r?.date||today()}">
    <label>種類</label><div class="type">${["支出","収入","お金を移す"].map(k=>`<button class="${kind===k?"active":""}" onclick="setKind('${k}')">${k}</button>`).join("")}</div>
    <input id="f_kind" type="hidden" value="${kind}">
    <label>金額</label><input id="f_amount" type="number" inputmode="numeric" placeholder="例：5000" value="${r?.amount||""}">
    <label>会計</label><select id="f_account">${ACCOUNTS.map(a=>`<option ${a===(r?.account||"教会")?"selected":""}>${a}</option>`).join("")}</select>
    <label id="personLabel">${kind==="収入"?"受け取った人":"支払った人"}</label>
    <input id="f_payer" value="${esc(r?.payer||"大和")}" placeholder="${kind==="収入"?"誰が受け取ったか":"誰が支払ったか"}">
    <label>支払先・購入先</label><input id="f_payee" list="storeChoices" value="${esc(r?.payee||"")}" placeholder="例：トライアル、コメリ、ナフコ"><datalist id="storeChoices">${customStores.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
    <label>用途・目的</label><input id="f_purpose" value="${esc(r?.purpose||"")}" placeholder="例：ガソリン、お供え、御霊前">
    <label>店舗還元（実際に戻った分・任意）</label><div class="note" id="rewardHint">${esc(storeRewards[r?.payee||""]||"店舗ごとの設定なし")}</div><input id="f_reward_amount" type="number" inputmode="numeric" min="0" placeholder="現金などで戻った金額（円）" value="${r?.rewardAmount||""}"><p class="note">還元がない店舗は空欄でOK。購入額はそのまま記録し、実際に戻った分だけ入力します。</p>

function saveForm(){
  const amount=Number(document.getElementById("f_amount").value);
  if(!amount){alert("金額を入力してください。");return}
  const paymentBreakdown={
    cash:Number(document.getElementById("f_pay_cash")?.value||0),
    paypay:Number(document.getElementById("f_pay_paypay")?.value||0),
    icoca:Number(document.getElementById("f_pay_icoca")?.value||0),
    points:Number(document.getElementById("f_pay_points")?.value||0)
  };
  const hasBreakdown=Object.values(paymentBreakdown).some(v=>v>0);
  const breakdownTotal=Object.values(paymentBreakdown).reduce((a,b)=>a+b,0);
  const paymentDetailsOpen=document.getElementById("paymentDetails")?.open||false;
  if(document.getElementById("f_kind").value==="支出" && hasBreakdown && breakdownTotal!==amount){
    alert(`購入総額は ${amount.toLocaleString("ja-JP")}円、支払い内訳の合計は ${breakdownTotal.toLocaleString("ja-JP")}円です。金額を確認してください。`);return;
  }
  const obj={
    id:editingId||Date.now(), date:document.getElementById("f_date").value,
    kind:document.getElementById("f_kind").value, amount,
    account:document.getElementById("f_account").value,payer:document.getElementById("f_payer").value.trim(),
    payee:document.getElementById("f_payee").value.trim(),purpose:document.getElementById("f_purpose").value.trim(),
    rewardAmount:Number(document.getElementById("f_reward_amount")?.value||0),rewardType:storeRewards[document.getElementById("f_payee").value.trim()]||"店舗ごとの設定なし",
    method:document.getElementById("f_method").value,location:document.getElementById("f_location").value,
    paymentBreakdownEnabled:paymentDetailsOpen, paymentBreakdown:hasBreakdown?paymentBreakdown:null,
    pointStore:document.getElementById("f_point_store")?.value.trim()||"",
    pointsEarned:Number(document.getElementById("f_points_earned")?.value||0),
    status:document.getElementById("f_status").value,
    reason:document.getElementById("f_status").value==="未確定"?document.getElementById("f_reason").value:"",
    advance:document.getElementById("f_advance").value==="1",
    advanceDirection:document.getElementById("f_advance").value==="1"?document.getElementById("f_advanceDirection").value:"",
    note:document.getElementById("f_note").value.trim()
  };
  if(editingId) records=records.map(x=>x.id==editingId?obj:x); else records.push(obj);
  save();

function renderAccounts(){

  const totals={}; [...new Set([...allManagedAccounts,...records.map(r=>r.account).filter(Boolean)])].forEach(a=>totals[a]={in:0,out:0});
  records.forEach(r=>{if(!totals[r.account])totals[r.account]={in:0,out:0}; if(r.kind==="収入")totals[r.account].in+=Number(r.amount||0); else if(r.kind==="支出")totals[r.account].out+=Number(r.amount||0)});
  let html=`<div class="section"><h2>会計</h2>

    <div class="account-actions">

      <button type="button" class="${accountView==="archived"?"archive-btn":""}" onclick="accountView='archived';render()">保管済み（${archivedAccounts.length}）</button>
    </div>
    <div id="accountFormHost"></div>`;
  if(accountView==="archived"){
    html+=`<div class="archived-note">保管済みの会計です。復元すると使用中の一覧に戻ります。記録は保持されています。</div>`;
  }
  if(!shownAccounts.length){
    html+=`<div class="empty">${accountView==="archived"?"保管済みの会計はありません。":"会計がありません。独立会計を作成できます。"}</div>`;
  }
  shownAccounts.forEach(a=>{
    const isArchived=accountIsArchived(a);
    const t=totals[a]||{in:0,out:0};
    const isCustom=customAccounts.includes(a);
    html+=`<div class="stat"><div class="account-card-head"><div><b>${esc(a)}</b>${isArchived?` <span class="badge warn">保管済み</span>`:""}${!isCustom&&!isArchived?` <span class="small">標準会計</span>`:""}</div>
      <div class="account-menu-wrap"><button type="button" class="account-menu-toggle" aria-label="${esc(a)}の操作" onclick="toggleAccountMenu('${esc(a)}')">⋯</button>
      ${openAccountMenu===a?`<div class="account-menu">${isArchived?`<button type="button" onclick="restoreAccount('${esc(a)}')">会計を復元</button><button type="button" onclick="beginAccountDelete('${esc(a)}')">保管済み一覧から除外</button>`:`<button type="button" onclick="archiveAccount('${esc(a)}')">会計を保管する</button>`}</div>`:""}</div></div>
      <div style="margin-top:8px"><span class="small">収入 ${yen(t.in)}　支出 ${yen(t.out)}</span><br><strong>差引 ${yen(t.in-t.out)}</strong></div></div>`;
  });
  html+=`<p class="note">会計の整理は、各カード右上の「⋯」から行えます。保管しても過去の収支記録は残ります。履歴を確実に残すため、定期的なバックアップ保存も行ってください。</p></div>`;
  document.getElementById("main").innerHTML=html;
}

    <input id="newAccountName" maxlength="40" placeholder="例：行事会計、備品会計">

function createAccount(){
  const input=document.getElementById("newAccountName");
  const name=(input?.value||"").trim();
  if(!name){alert("会計名を入力してください。");return;}
  refreshAccounts();
  if([...DEFAULT_ACCOUNTS,...customAccounts,...archivedAccounts.map(a=>a.name),...hiddenAccounts].includes(name)){alert("同じ名前の会計がすでにあります。");return;}
  customAccounts.push(name);saveAccounts();accountView="active";render();
  alert(`「${name}」を作成しました。`);
}
function toggleAccountMenu(name){openAccountMenu=openAccountMenu===name?"":name;render()}
function archiveAccount(name){
  openAccountMenu="";
  if(records.some(r=>r.account===name && !r.deletedAt)){
    if(!confirm(`「${name}」を保管します。\n\n過去の収支記録は残ります。通常の使用中一覧から外します。よろしいですか？`))return;
  }else if(!confirm(`「${name}」を保管しますか？`))return;
  if(!accountIsArchived(name))archivedAccounts.push({name,archivedAt:new Date().toISOString(),stage:1});
  saveAccounts();render();
}
function restoreAccount(name){
  openAccountMenu="";
  archivedAccounts=archivedAccounts.filter(a=>a.name!==name);
  if(!customAccounts.includes(name) && !DEFAULT_ACCOUNTS.includes(name))customAccounts.push(name);
  saveAccounts();accountView="active";render();
  alert(`「${name}」を復元しました。`);
}
function beginAccountDelete(name){
  openAccountMenu="";
  const typed=prompt(`第2段階の確認です。\n\n「${name}」を保管済み一覧から除外します。\n収支記録は削除されません。\n\n続行するには会計名をそのまま入力してください。`);
  if(typed!==name){if(typed!==null)alert("会計名が一致しないため、処理を中止しました。");return;}
  if(!confirm(`最終確認：保管済み一覧から「${name}」を除外します。\n\n過去の収支記録は残りますが、会計の管理画面からは見えなくなります。続けますか？`))return;
  archivedAccounts=archivedAccounts.filter(a=>a.name!==name);
  customAccounts=customAccounts.filter(a=>a!==name);
  if(!hiddenAccounts.includes(name))hiddenAccounts.push(name);
  // Hide from account management and new-entry choices, but preserve every transaction record.
  saveAccounts();refreshAccounts();render();
  alert("会計を一覧から除外しました。過去の収支記録は削除していません。バックアップも定期的に保存してください。");
}

    html+=`<div class="stat"><h3>${esc(event)}</h3><div class="small">予定 ${yen(expected)}　納入 ${yen(paid)}　未納 ${yen(Math.max(0,expected-paid))}</div>`;
    items.forEach(c=>{

    });
    html+='</div>';
  });
  html+=`<p class="note">入金を登録すると、対応する収入記録に納入項目IDを保存します。入金の取消・訂正を行う際は、納入一覧と会計履歴の両方をご確認ください。</p></div>`;
  document.getElementById('main').innerHTML=html;

function showCollectionForm(id){
 const c=id?collections.find(x=>String(x.id)===String(id)):null;
 const host=document.getElementById('collectionFormHost'); if(!host)return;
 host.innerHTML=`<div class="stat"><h3>${c?'納入項目を編集':'納入項目を追加'}</h3>
 <label>行事・目的</label><input id="c_event" maxlength="80" placeholder="例：子弟錬成会、月次祭お供え" value="${esc(c?.eventName||'')}">

 <label>氏名・納入者</label><input id="c_person" maxlength="80" placeholder="例：山田さん" value="${esc(c?.person||'')}">

function saveCollection(id){
 const eventName=document.getElementById('c_event').value.trim(),person=document.getElementById('c_person').value.trim(),expected=Number(document.getElementById('c_expected').value);
 if(!eventName||!person||expected<=0){alert('行事・目的、氏名、予定額を入力してください。');return;}
 const old=id?collections.find(x=>String(x.id)===String(id)):null;
 if(old && Number(old.paid||0)>expected){alert('予定額はすでに納入された金額以上にしてください。');return;}
 const obj={id:old?old.id:Date.now().toString(),eventName,kind:document.getElementById('c_kind').value,person,expected,paid:old?.paid||0,account:document.getElementById('c_account').value,payments:old?.payments||[]};
 if(old)collections=collections.map(x=>String(x.id)===String(id)?obj:x);else collections.push(obj);
 saveCollections();render();
}
function editCollection(id){showCollectionForm(id)}
function receiveCollection(id){
 const c=collections.find(x=>String(x.id)===String(id));if(!c)return;
 const due=Math.max(0,Number(c.expected||0)-Number(c.paid||0));if(!due){alert('すでに全額納入済みです。');return;}
 const raw=prompt(`「${c.eventName}」\n${c.person}さんの入金額を入力してください。\n残り：${yen(due)}`,String(due));if(raw===null)return;
 const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0||amount>due){alert('入金額を確認してください。残額以下の正の金額を入力してください。');return;}
 const method=prompt('支払方法を入力してください（例：現金、振込、PayPay）','現金');if(method===null)return;
 const date=prompt('入金日を入力してください（YYYY-MM-DD）',today());if(date===null)return;
 const paymentId=Date.now().toString();
 const record={id:Date.now()+Math.floor(Math.random()*1000),date,kind:'収入',amount,account:c.account||'教会',payer:c.person,payee:'',purpose:c.eventName+'（'+c.kind+'）',method:method.trim()||'現金',location:'',status:'確定',note:'納入管理から登録',collectionId:c.id,collectionPaymentId:paymentId};
 records.push(record);c.paid=Number(c.paid||0)+amount;c.payments=c.payments||[];c.payments.push({id:paymentId,recordId:record.id,amount,date,method:record.method});save();saveCollections();render();alert(`${yen(amount)}を納入として記録し、会計の収入にも反映しました。`);
}
function deleteCollection(id){
 const c=collections.find(x=>String(x.id)===String(id));if(!c)return;
 if((c.paid||0)>0){alert('入金記録があるため、この納入項目は削除できません。先に会計履歴を確認し、入金の訂正方法を決めてください。');return;}
 if(confirm(`「${c.eventName}／${c.person}」を削除しますか？`)){collections=collections.filter(x=>String(x.id)!==String(id));saveCollections();render();}
}

function renderHistory(){
  refreshAccounts();
  const allNames=[...new Set([...ACCOUNTS,...records.map(r=>r.account).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,"ja"));
  const now=today();
  const monthStart=now.slice(0,8)+"01";
  const params=window.historyFilters||{account:"すべて",period:"今月",start:monthStart,end:now};
  let start=params.start||monthStart, end=params.end||now;
  if(params.period==="今月"){start=monthStart;end=now;}
  if(params.period==="先月"){
    const d=new Date(now+"T00:00:00");d.setDate(1);d.setMonth(d.getMonth()-1);
    start=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
    const last=new Date(d.getFullYear(),d.getMonth()+1,0);end=`${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,"0")}-${String(last.getDate()).padStart(2,"0")}`;
  }
  if(params.period==="今年"){start=now.slice(0,4)+"-01-01";end=now;}
  if(params.period==="全期間"){start="0000-01-01";end=now;}
  const accountOptions=["すべて",...allNames].map(a=>`<option value="${esc(a)}" ${a===params.account?"selected":""}>${esc(a)}</option>`).join("");
  const periodOptions=["今月","先月","今年","全期間","期間指定"].map(a=>`<option ${a===params.period?"selected":""}>${a}</option>`).join("");
  const matches=records.filter(r=>(params.account==="すべて"||r.account===params.account)&&r.date>=start&&r.date<=end).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||Number(b.id)-Number(a.id));
  const totalKind=(kind,rs=matches)=>rs.filter(r=>r.kind===kind).reduce((sum,r)=>sum+Number(r.amount||0),0);
  const income=totalKind("収入"), expense=totalKind("支出"), net=income-expense;
  const upto=records.filter(r=>(params.account==="すべて"||r.account===params.account)&&r.date<=end);
  const balance=totalKind("収入",upto)-totalKind("支出",upto);
  document.getElementById("main").innerHTML=`<div class="section"><h2>出納履歴</h2>
    <p class="note">会計ごとの収入・支出を、指定した期間で確認できます。お金を移す記録は、収入・支出の合計には含めません。</p>
    <label>会計区分</label><select id="historyAccount">${accountOptions}</select>
    <label>閲覧期間</label><select id="historyPeriod">${periodOptions}</select>
    <div class="history-dates" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
      <div><label>開始日</label><input id="historyStart" type="date" value="${esc(start)}" ${params.period!=="期間指定"?"disabled":""}></div>
      <div><label>終了日</label><input id="historyEnd" type="date" value="${esc(end)}" ${params.period!=="期間指定"?"disabled":""}></div>
    </div>
    <button class="primary" id="applyHistory">この条件で表示</button>
    <div class="stat-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <div class="stat">収入合計<br><b style="color:#16834a">${yen(income)}</b></div>
      <div class="stat">支出合計<br><b style="color:#b42323">${yen(expense)}</b></div>
      <div class="stat">期間内の差引収支<br><b>${net>=0?"＋":"−"}${yen(Math.abs(net))}</b></div>
      <div class="stat">期間終了日までの累計差引<br><b>${balance>=0?"＋":"−"}${yen(Math.abs(balance))}</b></div>
    </div>
    <div class="daybar"><span>${esc(start)} ～ ${esc(end)}</span><span>${matches.length}件</span></div>
    <div id="historyResults">${matches.length?matches.map(r=>recordCard(r)).join(""):`<div class="empty">この期間の記録はありません。</div>`}</div>
  </div>`;
  document.getElementById("historyPeriod").addEventListener("change",e=>{
    const custom=e.target.value==="期間指定";
    document.getElementById("historyStart").disabled=!custom;
    document.getElementById("historyEnd").disabled=!custom;
  });
  document.getElementById("applyHistory").addEventListener("click",()=>{
    const period=document.getElementById("historyPeriod").value;
    const startValue=document.getElementById("historyStart").value;
    const endValue=document.getElementById("historyEnd").value;
    if(period==="期間指定"&&(!startValue||!endValue||startValue>endValue)){alert("開始日と終了日を確認してください。");return;}
    window.historyFilters={account:document.getElementById("historyAccount").value,period,start:startValue,end:endValue};
    renderHistory();
  });
}

function renderSummary(){
  const unsettled=records.filter(r=>r.status==="未確定");
  const advance=records.filter(r=>r.advance);
  const total=r=>r.reduce((s,x)=>s+x.amount,0);
  document.getElementById("main").innerHTML=`<div class="section"><h2>集計</h2>
    <div class="stat">未確定<br><b>${yen(total(unsettled))}</b><br><span class="small">${unsettled.length}件</span></div>
    <div class="stat">立替<br><b>${yen(total(advance))}</b><br><span class="small">${advance.length}件</span></div>
    <div class="stat">記録件数<br><b>${records.length}件</b></div>
  </div>`;
}
function renderSearch(){
  document.getElementById("main").innerHTML=`<div class="panel"><h2>検索</h2>
  <input id="q" placeholder="支払先・用途・会計・人など" oninput="doSearch()" autofocus>
  <div id="results" style="margin-top:12px"></div></div>`;
}
function doSearch(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const rs=records.filter(r=>[r.account,r.payer,r.payee,r.purpose,r.method,r.location,r.reason,r.note].join(" ").toLowerCase().includes(q));
  document.getElementById("results").innerHTML=rs.length?rs.map(r=>recordCard(r)).join(""):`<div class="empty">${q?"該当する記録はありません。":"検索語を入力してください。"}</div>`;
}
function renderSettings(){
  document.getElementById("main").innerHTML=`<div class="section"><div class="settings-heading"><h2>設定</h2><button class="settings-close" onclick="closeSettings()">✕ 閉じる</button></div>
    <div class="stat"><b>データ</b><br><span class="small">現在 ${records.length}件の記録があります。データはこの端末のブラウザに保存されます。</span></div>
    <h3>購入先・支払方法・ポイントの管理</h3>
    <p class="note">一度登録すると、記録画面で候補から選べます。購入先は入力欄で候補表示、支払方法とポイント名も自由に追加できます。</p>
    <div class="stat"><b>購入先</b><div id="storeManager">${customStores.map((x,i)=>`<div class="listline"><span>${esc(x)}</span><button onclick="removeSettingItem('store',${i})">削除</button></div>`).join("")}</div><button class="filter" onclick="addSettingItem('store')">＋ 購入先を追加</button></div>
    <div class="stat"><b>店舗ごとの還元設定</b><p class="note">還元の有無や戻り方は店舗ごとに違います。ここで設定し、実際に還元があった日だけ記録画面で金額を入力します。</p><div id="rewardManager">${customStores.map((x,i)=>`<div class="listline" style="gap:8px"><span style="flex:1">${esc(x)}</span><select onchange="setStoreReward(${i},this.value)"><option ${(!storeRewards[x]||storeRewards[x]==="還元なし")?"selected":""}>還元なし</option><option ${storeRewards[x]==="現金還元"?"selected":""}>現金還元</option><option ${storeRewards[x]==="残高還元"?"selected":""}>残高還元</option><option ${storeRewards[x]==="通常ポイント"?"selected":""}>通常ポイント</option><option ${storeRewards[x]==="店舗ごとに確認"?"selected":""}>店舗ごとに確認</option></select></div>`).join("")}</div></div>
    <div class="stat"><b>支払方法</b><div id="methodManager">${customMethods.map((x,i)=>`<div class="listline"><span>${esc(x)}</span><button onclick="removeSettingItem('method',${i})">削除</button></div>`).join("")}</div><button class="filter" onclick="addSettingItem('method')">＋ 支払方法を追加</button><p class="note">現金・PayPay・ICOCAなどの標準項目は最初から選べます。</p></div>
    <div class="stat"><b>ポイントサービス</b><div id="pointManager">${pointServices.map((x,i)=>`<div class="listline"><span>${esc(x)}</span><button onclick="removeSettingItem('point',${i})">削除</button></div>`).join("")}</div><button class="filter" onclick="addSettingItem('point')">＋ ポイントサービスを追加</button></div>
    <button class="primary" onclick="exportData()">バックアップ保存</button>
    <button class="primary" onclick="importData()">バックアップ復元</button>
    <button class="primary danger" onclick="clearAll()">全データを削除</button>
    <p class="note">今は試作版です。大切な記録は、定期的に「バックアップ保存」してください。GitHub上には入力データは保存されません。</p>
  </div>`;
}
function closeSettings(){currentTab="records";render();}
function setStoreReward(index,value){const name=customStores[index];storeRewards[name]=value;savePaymentSettings();renderSettings();}
function addSettingItem(type){
  const labels={store:"購入先の名前",method:"支払方法の名前",point:"ポイントサービスの名前"};
  const value=prompt(labels[type]+"を入力してください。"); if(!value||!value.trim())return;
  const v=value.trim(); let arr=type==="store"?customStores:type==="method"?customMethods:pointServices;
  if(arr.includes(v)){alert("同じ名前がすでに登録されています。");return;}
  arr.push(v); if(type==="store"&&!storeRewards[v])storeRewards[v]="還元なし"; savePaymentSettings(); renderSettings();
}
function removeSettingItem(type,index){
  const arr=type==="store"?customStores:type==="method"?customMethods:pointServices;
  const value=arr[index]; if(!confirm("「"+value+"」を候補一覧から削除しますか？\n過去の記録そのものは削除されません。"))return;
  arr.splice(index,1);savePaymentSettings();renderSettings();
}
function exportData(){
  const backup={format:"kaikei_matome_backup_v7",records,collections,customAccounts,archivedAccounts,hiddenAccounts,customStores,customMethods,pointServices,storeRewards};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="会計まとめ_バックアップ.json";a.click();
}
function importData(){
  const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
  input.onchange=()=>{const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{
    const data=JSON.parse(rd.result);
    if(Array.isArray(data)){records=data;} 
    else if(data && Array.isArray(data.records)){
      records=data.records;
      if(Array.isArray(data.collections))collections=data.collections;
      if(Array.isArray(data.customAccounts))customAccounts=data.customAccounts;
      if(Array.isArray(data.archivedAccounts))archivedAccounts=data.archivedAccounts;
      if(Array.isArray(data.hiddenAccounts))hiddenAccounts=data.hiddenAccounts;
      if(Array.isArray(data.customStores))customStores=data.customStores;
      if(Array.isArray(data.customMethods))customMethods=data.customMethods;
      if(Array.isArray(data.pointServices))pointServices=data.pointServices;
      if(data.storeRewards&&typeof data.storeRewards==="object")storeRewards=data.storeRewards;
      saveAccounts();savePaymentSettings();saveCollections();refreshAccounts();
    } else {throw new Error("invalid backup");}
    save();refreshAccounts();render();alert("復元しました。");
  }catch(e){alert("バックアップファイルを読み込めませんでした。")}};rd.readAsText(f)};
  input.click();
}
function clearAll(){if(!records.length){alert("削除する記録はありません。");return;} if(confirm(`この端末に保存されている ${records.length}件の記録をすべて削除します。

この操作は元に戻せません。
バックアップが必要なら先に保存してください。`)){records=[];save();currentDate=today();currentTab="records";render();}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()});
render();
</script>
</body>
</html>
